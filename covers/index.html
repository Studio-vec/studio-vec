<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<title>Kim Taehui — Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Newsreader:opsz,wght@6..72,400&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   GRID SYSTEM  (reference artboard 838 × 587)
   margin  L/R 26  → 3.1vw      top/bottom 24 → 4.1vh
   7 columns × ~100, gutter 14 → 1.67vw
   ─ header labels : col 1 / col 3 / col 5
   ─ symbol        : col 1 – 4
   ─ title band    : col 5 – 7 (two horizontal guides)
   ─ footer        : col 1–2 (team) / col 3–6 (explanation)
   ========================================================= */
:root{
  --paper:#f2f4f7;
  --ink:#111;
  --sub:#8a8d94;
  --guide:#7d86f5;
  --guide-strong:#4f6ef0;
  --margin-line:#e070c0;
  --path-sel:#3b82e6;
  --yellow:#e2e400;
  --m:clamp(16px,3.1vw,48px);
  --mt:clamp(16px,4.1vh,40px);
  --g:clamp(8px,1.67vw,24px);
  --label:clamp(10px,.95vw,13px);
  --title:min(5.8vw,8.6vh);
  --ease:cubic-bezier(.77,0,.18,1);
  --stroke:var(--ink);
  --anchor:var(--ink);
}
*{box-sizing:border-box}
html{scroll-snap-type:y proximity}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Newsreader","Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
.ko{font-family:"Noto Serif KR",serif}

/* scroll track : one viewport per project */
.track > div{height:100vh;scroll-snap-align:start}

/* ================= COVER STAGE ================= */
.stage{
  position:fixed;inset:0;overflow:hidden;
  transition:transform 1s var(--ease);
  cursor:pointer;
}
body.detail-open .stage{transform:translateX(-100%)}
.frame-grid{
  position:absolute;inset:var(--mt) var(--m);
  display:grid;grid-template-columns:repeat(7,1fr);column-gap:var(--g);
  grid-template-rows:auto 1fr auto;
}

/* labels */
.lbl{font-size:var(--label);line-height:1.35;position:relative;align-self:start}
.slot{overflow:hidden;height:calc(var(--label)*1.35);position:relative}
.slot.l3{height:calc(var(--label)*1.6*3)}
.reel{will-change:transform}
.reel > div{height:calc(var(--label)*1.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.l3 .reel > div{height:calc(var(--label)*1.6*3);white-space:normal;line-height:1.6}
.top .lbl{grid-row:1}
.bot{grid-row:3;align-self:start}
.l-field{grid-column:1/2}
.l-name{grid-column:3/4}
.l-tools{grid-column:5/7}
.l-team{grid-column:1/3}
.l-desc{grid-column:3/7}
.l-count{grid-column:7/8}
.l-desc .reel > div{font-family:"Noto Serif KR",serif;font-size:calc(var(--label)*.96)}
.l-name .reel > div{font-family:"Noto Serif KR","Newsreader",serif}

/* symbol */
.sym-wrap{grid-column:1/5;grid-row:2;position:relative;align-self:stretch;min-height:0}
.sym-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sym path.shape{fill:none;stroke:var(--stroke);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:miter;transition:stroke .3s}
.sym rect.anc{fill:var(--anchor);transition:fill .3s}
.sym rect.sel{fill:var(--yellow);stroke:var(--anchor);stroke-width:1;vector-effect:non-scaling-stroke}
.sym .bbox rect.box{fill:none;stroke:var(--guide-strong);stroke-width:1;vector-effect:non-scaling-stroke}
.sym .bbox rect.h{fill:#fff;stroke:var(--guide-strong);stroke-width:1;vector-effect:non-scaling-stroke}
.sym .bbox text{font:10px "Newsreader",serif;fill:#fff}
.sym .bbox rect.tag{fill:var(--guide-strong)}

/* title band */
.title-band{
  grid-column:5/8;grid-row:2;align-self:center;
  height:calc(var(--title)*2.25);overflow:hidden;position:relative;
  margin-right:calc(var(--m)*-1);padding-right:var(--m);
}
.title-band .reel > div{
  height:calc(var(--title)*2.25);display:flex;flex-direction:column;justify-content:center;
  font-family:"Instrument Serif",serif;font-weight:400;font-size:var(--title);line-height:1.04;letter-spacing:-.01em;
}
.title-band .reel span{display:block;white-space:nowrap}

/* left-middle : back to the first intro page (shown on every project cover) */
.stageBack{position:absolute;left:calc(var(--m) - 16px);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;background:none;border:0;padding:16px;cursor:pointer;font-family:"Newsreader","Noto Serif KR",serif;font-size:var(--label);letter-spacing:.06em;color:var(--sub);z-index:5}
.stageBack:hover{color:var(--ink)}
.stageBack svg{width:14px;height:14px;display:block;transition:transform .3s var(--ease)}
.stageBack:hover svg{transform:translateX(-3px)}

/* corner markers (selection-box icons) */
.corner{position:absolute;right:calc(var(--m) - 12px);width:22px;height:22px;cursor:pointer;background:none;border:0;padding:0}
.corner.tr{top:calc(var(--mt) - 12px)}
.corner.br{bottom:calc(var(--mt) - 12px)}
.corner svg{width:22px;height:22px;display:block}

/* ================= GUIDES (Ctrl+; / G) ================= */
.guides{position:absolute;inset:var(--mt) var(--m);pointer-events:none;opacity:0;transition:opacity .5s}
.guides .cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);column-gap:var(--g)}
.guides .cols i{border-left:1px solid var(--guide);border-right:1px solid var(--guide)}
.guides .page{position:absolute;inset:0;border:1px solid var(--guide);border-top-color:var(--margin-line)}
.guides .page::before{content:"";position:absolute;top:-1px;left:calc(var(--m)*-1);right:calc(var(--m)*-1);border-top:1px solid var(--margin-line)}
body.show-guides .guides{opacity:1}
.fr{outline:1px solid transparent;outline-offset:0;transition:outline-color .5s}
body.show-guides .fr{outline-color:var(--guide)}
body.show-guides{--stroke:var(--path-sel);--anchor:#10205a}

/* cursor tag (smart-guide label) */
.ctag{
  position:fixed;left:0;top:0;pointer-events:none;z-index:40;
  font:11px/1 "Newsreader",serif;letter-spacing:.02em;color:#fff;background:var(--guide-strong);
  padding:4px 6px 3px;opacity:0;transition:opacity .2s;white-space:nowrap
}
.ctag.on{opacity:1}

/* cursor orb — follows the pointer inside the intro, blooms on interactive elements */
.cursor-orb{
  position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;
  border:1px solid var(--ink);border-radius:50%;pointer-events:none;z-index:1;
  mix-blend-mode:multiply;
  opacity:0;transition:width .28s var(--ease),height .28s var(--ease),margin .28s var(--ease),
    background .25s var(--ease),border-radius .25s var(--ease),border-color .25s var(--ease),opacity .3s;
}
body.intro-open .cursor-orb{opacity:1}
.cursor-orb.active{width:38px;height:38px;margin:-19px 0 0 -19px;background:var(--yellow);border-color:var(--ink)}
.cursor-orb.square{border-radius:6px}
@media (pointer:coarse),(prefers-reduced-motion:reduce){.cursor-orb,.cursor-fx{display:none}}
.cursor-fx{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:1}
.cfx-p{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--ink);border-radius:50%;opacity:.9}
.cfx-p.sq{border-radius:1px}
.cfx-p.yellow{background:var(--yellow)}
.intro .navlink,.intro .backlink,.work-row,.stageBack{position:relative;z-index:2}

/* ================= DETAIL PAGE — A4 landscape sheets ================= */
.detail{
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--paper);
  transform:translateX(100%);transition:transform 1s var(--ease);z-index:20;
  border-left:1px solid var(--guide);
  overscroll-behavior:contain;scroll-snap-type:y proximity;
  --bar:48px;
  --sw:min(calc(100vw - var(--m)*2), calc((100vh - var(--bar) - var(--mt)*1.4) * 1.4143));
}
body.detail-open .detail{transform:translateX(0)}
.detail.no-anim{transition:none}
.detail.swap-out{transform:translateX(-100%)!important}
.detail.swap-in{transform:translateX(100%)!important;transition:none}

/* top bar : index · project · page links */
.d-bar{
  position:sticky;top:0;z-index:5;height:var(--bar);padding:0 var(--m);
  display:grid;grid-template-columns:repeat(7,1fr);column-gap:var(--g);align-items:center;
  background:var(--paper);font-size:var(--label);line-height:1.35
}
.d-bar button,.d-bar a{all:unset;cursor:pointer}
.d-bar button:hover,.d-bar a:hover{color:var(--guide-strong)}
.d-bar .b-back{grid-column:1/2}
.d-bar .b-name{grid-column:3/5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-bar .b-name i{font-style:normal;font-family:"Noto Serif KR",serif;color:var(--sub);margin-left:.8em}
.d-bar .b-links{grid-column:5/8;display:flex;justify-content:flex-end;gap:1.6em;white-space:nowrap}
.d-bar .b-links span{color:var(--sub)}

.sheets{display:flex;flex-direction:column;align-items:center;gap:calc(var(--mt)*.7);padding:calc(var(--mt)*.2) 0 var(--mt)}

/* one sheet = 297 × 210 mm. 1mm = 100cqw / 297 */
.sheet{
  --mm:calc(100cqw / 297);
  position:relative;width:var(--sw);aspect-ratio:297/210;flex:none;
  background:#fff;box-shadow:0 0 0 1px rgba(17,17,17,.07);
  container-type:inline-size;overflow:hidden;scroll-snap-align:center
}
.sheet > *{--u:calc(100cqw / 297)}
.s-hd{
  position:absolute;left:calc(9.2*var(--u));right:calc(9.2*var(--u));top:calc(8.6*var(--u));
  display:grid;grid-template-columns:repeat(7,1fr);column-gap:calc(5*var(--u));
  font-size:calc(2.5*var(--u));line-height:1.3;color:var(--ink)
}
.s-hd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-hd .h-proj{grid-column:1/3}
.s-hd .h-sec{grid-column:3/6}
.s-hd .h-pg{grid-column:7/8;text-align:right;color:var(--sub)}
.s-hd .h-proj i{font-style:italic;color:var(--sub);margin-right:.6em}

/* images : positioned in sheet mm by tools/build_covers.js */
.s-art{position:absolute;inset:0}
.cell{position:absolute;left:calc(var(--x)/297*100%);top:calc(var(--y)/210*100%);width:calc(var(--w)/297*100%);height:calc(var(--h)/210*100%);margin:0}
.cell .crop{position:absolute;inset:0;overflow:hidden}
.cell img,.cell video{display:block;width:100%;height:100%;object-fit:cover}
.cell .crop img{position:absolute;left:0;height:auto;aspect-ratio:auto}
.cell figcaption{
  position:absolute;left:0;top:0;z-index:2;opacity:0;transition:opacity .2s;max-width:100%;
  font:11px/1 "Newsreader","Noto Serif KR",serif;color:#fff;background:var(--guide-strong);padding:4px 6px 3px;display:flex;gap:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.cell::after{content:"";position:absolute;inset:0;outline:1px solid var(--guide-strong);outline-offset:-1px;opacity:0;transition:opacity .2s;pointer-events:none}
.cell .hd{position:absolute;width:7px;height:7px;background:#fff;border:1px solid var(--guide-strong);opacity:0;transition:opacity .2s;z-index:1}
.cell .hd.a{left:-3px;top:-3px}.cell .hd.b{right:-3px;top:-3px}.cell .hd.c{left:-3px;bottom:-3px}.cell .hd.d{right:-3px;bottom:-3px}
.cell:hover::after,.cell:hover .hd,.cell:hover figcaption{opacity:1}

/* text column : col 1–2 (section sheets) · col 1–3 (opener) · col 1–4 (text-only) */
.s-txt{
  position:absolute;left:calc(9.2*var(--u));top:calc(19*var(--u));bottom:calc(8.6*var(--u));width:calc(76*var(--u));
  display:flex;flex-direction:column;gap:calc(3.2*var(--u));
  font-family:"Noto Serif KR",serif;font-size:calc(2.75*var(--u));line-height:1.72;color:var(--ink);overflow:hidden
}
.s-txt.wide{width:calc(278.6*var(--u))}
.s-txt.wide .t-pull{font-size:calc(9*var(--u));line-height:1.3;max-width:calc(157*var(--u))}
.s-txt.wide .t-facts{margin-top:auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;column-gap:calc(5*var(--u))}
.t-facts{display:flex;flex-direction:column;gap:calc(2.4*var(--u))}
.s-txt p{margin:0}
.s-txt .t-num{font-family:"Newsreader",serif;font-style:italic;color:var(--sub);font-size:calc(2.5*var(--u));line-height:1}
.s-txt .t-head{font-family:"Instrument Serif",serif;font-size:calc(9*var(--u));line-height:1.02;letter-spacing:-.01em;margin-top:calc(1*var(--u))}
.s-txt .t-head small{display:block;font-family:"Noto Serif KR",serif;font-size:calc(2.5*var(--u));color:var(--sub);letter-spacing:0;margin-top:calc(1.6*var(--u))}
.s-txt .t-sub{font-family:"Instrument Serif",serif;font-size:calc(5.4*var(--u));line-height:1.1;padding-top:calc(2.6*var(--u));border-top:1px solid rgba(17,17,17,.12)}
.s-txt .t-sub i{font-family:"Newsreader",serif;font-size:calc(2.5*var(--u));color:var(--sub);margin-right:.8em;vertical-align:middle}
.s-txt .t-sub small{display:block;font-family:"Noto Serif KR",serif;font-size:calc(2.4*var(--u));color:var(--sub);margin-top:calc(1*var(--u))}
.s-txt .t-pull{font-size:calc(5*var(--u));line-height:1.4}
.s-txt .t-en{font-family:"Newsreader",serif;color:#8a8d94;font-size:calc(2.6*var(--u));line-height:1.55}
.s-txt .t-fact{border-top:1px solid rgba(17,17,17,.12);padding-top:calc(1.6*var(--u))}
.s-txt .t-fact b{display:block;font-weight:400;font-family:"Newsreader",serif;color:var(--sub);font-size:calc(2.4*var(--u));margin-bottom:calc(.6*var(--u))}
.s-txt .t-sw{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(2*var(--u)) calc(2.4*var(--u))}
.s-txt .t-sw div{font-size:calc(2.2*var(--u));line-height:1.35}
.s-txt .t-sw i{display:block;aspect-ratio:1.6;margin-bottom:calc(1*var(--u));box-shadow:inset 0 0 0 1px rgba(17,17,17,.1)}
.s-txt .t-sw span{display:block;color:var(--sub);font-family:"Newsreader",serif}

/* opener */
.s-open .s-txt{width:calc(116.5*var(--u));gap:0}
.s-open .o-sym{position:relative;height:calc(34*var(--u));width:calc(52*var(--u));margin-bottom:calc(6*var(--u))}
.s-open .o-sym svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.s-open .o-sym rect{display:none}                       /* outline only — anchors read as noise at this size */
.s-open .o-title{margin:0;font-weight:400;font-family:"Instrument Serif",serif;font-size:calc(13*var(--u));line-height:1;letter-spacing:-.01em}
.s-open .o-title span{display:block;white-space:nowrap}
.s-open .o-ko{color:var(--sub);margin-top:calc(2.4*var(--u))}
.s-open .o-desc{margin-top:calc(6*var(--u));display:flex;flex-direction:column;gap:calc(2*var(--u));max-width:calc(105*var(--u))}
.s-open .o-info{margin-top:auto;display:grid;grid-template-columns:calc(22*var(--u)) 1fr;font-size:calc(2.5*var(--u));line-height:1.55}
.s-open .o-info .k,.s-open .o-info .v{padding:calc(1.5*var(--u)) 0;border-top:1px solid rgba(17,17,17,.12)}
.s-open .o-info .k{font-family:"Newsreader",serif;color:var(--sub)}

/* end : next project */
.d-end{display:flex;justify-content:center;padding:0 var(--m) calc(var(--mt)*2)}
.d-nextbtn{all:unset;cursor:pointer;width:var(--sw);display:flex;justify-content:space-between;align-items:baseline;padding-top:calc(var(--mt)*.6);border-top:1px solid rgba(17,17,17,.12);font-size:var(--label)}
.d-nextbtn:hover{color:var(--guide-strong)}
.d-nextbtn b{font-weight:400;font-family:"Instrument Serif",serif;font-size:calc(var(--label)*2.6);line-height:1}

/* ================= INTRO — 2 pages shown before the cover stage ================= */
body.intro-open{overflow:hidden}
.intro{position:fixed;inset:0;z-index:30;overflow:hidden;background:var(--paper);transition:transform 1s var(--ease)}
body:not(.intro-open) .intro{transform:translateX(-100%);pointer-events:none}
.intro-track{position:absolute;inset:0;width:200%;display:flex;transition:transform 1s var(--ease)}
body.intro-page2 .intro-track{transform:translateX(-50%)}
.intro-page{width:50%;height:100%;position:relative;flex:none}
.intro-grid{position:absolute;inset:var(--mt) var(--m);display:grid;grid-template-columns:repeat(7,1fr);column-gap:var(--g);grid-template-rows:auto 1fr auto;height:calc(100% - var(--mt)*2)}
.intro .lbl{font-size:var(--label);line-height:1.35}
.i-field{grid-column:1/3;grid-row:1}
.i-name{grid-column:3/5;grid-row:1;text-align:center}
.i-tools{grid-column:5/8;grid-row:1;text-align:right}
.i-edu{grid-column:1/3;grid-row:3;align-self:start}
.i-awd{grid-column:3/7;grid-row:3;align-self:start;font-family:"Noto Serif KR",serif;font-size:calc(var(--label)*.96);line-height:1.55}

/* two-choice CTA — download (primary) stacked above a motion-driven scroll cue */
.cta-zone{grid-column:1/8;grid-row:2;align-self:stretch;display:flex;flex-direction:column;gap:calc(var(--g)*.7)}

.cta-download{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;flex-direction:column;justify-content:space-between;
  min-height:clamp(300px,52vh,580px);padding:clamp(48px,7vh,104px) clamp(36px,4.4vw,76px);
  border:1px solid rgba(17,17,17,.16);background:var(--paper);color:var(--ink);
  text-decoration:none;cursor:pointer;transition:border-color .3s var(--ease);
}
.cta-download:hover{border-color:var(--ink)}
.cta-download::before{content:"";position:absolute;inset:0;background:var(--yellow);transform:scaleY(0);transform-origin:bottom;transition:transform .55s var(--ease);z-index:-1}
.cta-download:hover::before{transform:scaleY(1)}
.cta-num{font-size:var(--label);color:var(--sub);letter-spacing:.08em}
.cta-label{display:block}
.cta-label b{display:block;margin:.3em 0 .2em;font-weight:400;font-family:"Instrument Serif",serif;font-size:clamp(44px,6.6vw,100px);line-height:.98;letter-spacing:-.01em}
.cta-label i{display:block;font-style:normal;font-family:"Noto Serif KR",serif;font-size:var(--label);color:var(--sub)}
.cta-icon{align-self:flex-end;width:26px;height:26px;transition:transform .3s var(--ease)}
.cta-download:hover .cta-icon{transform:translateY(6px)}
.cta-p{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:var(--ink);border-radius:50%;pointer-events:none;opacity:.85;z-index:2}
.cta-p.sq{border-radius:1px}
.cta-p.yellow{background:var(--yellow);mix-blend-mode:multiply}

/* scroll cue — motion invites the gesture instead of a boxed button */
.cta-scroll{all:unset;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(var(--g)*.55) 0;width:100%}
.cta-scroll-motion{display:flex;flex-direction:column;align-items:center;height:30px;overflow:hidden}
.csm-chev{width:18px;height:11px;color:var(--sub);opacity:.25;animation:csmBounce 1.6s var(--ease) infinite}
.csm-chev:nth-child(2){opacity:.55;animation-delay:.12s;margin-top:-2px}
.csm-chev:nth-child(3){opacity:1;color:var(--ink);animation-delay:.24s;margin-top:-2px}
.cta-scroll-label{font-size:var(--label);letter-spacing:.1em;color:var(--sub);display:flex;align-items:center;gap:8px;transition:color .3s var(--ease)}
.cta-scroll-label i{font-style:normal;color:var(--sub);opacity:.7}
.cta-scroll:hover .cta-scroll-label{color:var(--ink)}
.cta-scroll:hover .csm-chev{animation-duration:.85s}
@keyframes csmBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

.intro .navlink{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-family:"Instrument Serif",serif;font-size:calc(var(--label)*1.9);color:var(--ink)}
.intro .navlink svg{width:15px;height:15px;transition:transform .3s var(--ease)}
.intro .navlink.down:hover svg{transform:translateY(3px)}
.intro .navlink.right:hover svg{transform:translateX(3px)}
.intro .backlink{all:unset;cursor:pointer;font-size:var(--label);letter-spacing:.06em;color:var(--sub)}
.intro .backlink:hover{color:var(--ink)}
.intro .foot{position:absolute;left:var(--m);right:var(--m);bottom:var(--mt);display:flex;justify-content:space-between;align-items:center}
.intro .dlmini{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:var(--label);color:var(--sub)}
.intro .dlmini:hover{color:var(--ink)}
.intro .dlmini svg{width:13px;height:13px}

h":71.2,"cap":"12"},{"src":"/assets/img/projects/p03-starry/img-14.webp","x":156.8,"y":19,"w":131,"h":74.5,"cap":"13"},{"src":"/assets/img/projects/p03-starry/img-15.jpg","x":156.8,"y":96.5,"w":131,"h":45.5,"cap":"14"},{"src":"/assets/img/projects/p03-starry/img-16.jpg","x":156.8,"y":145,"w":131,"h":51.6,"cap":"15"}]}],"flant":[{"open":1,"desc":["FLANT : Design Roots는 식물 애호가 즉, 식집사를 위한 브랜드 기획 프로젝트로, 키비주얼부터 캐릭터, 제품, 패키지까지 전 과정을 설계했다.","이미지 소스 생성에 AI를 적극 활용하고 Illustrator를 병행해 모바일 환경부터 대형 인쇄물까지 확장 가능한 범용 그래픽과 비주얼 시스템을 구축했다."],"cells":[{"src":"/assets/img/projects/p04-flant/img-01.jpg","x":143.8,"y":19,"w":130.9,"h":182.4,"cap":"Flant"}]},{"sec":"","cells":[{"src":"/assets/img/projects/p04-flant/img-02.webp","x":9.2,"y":19,"w":278.6,"h":156.7,"cap":"01"}]},{"sec":"","text":[{"k":"p","html":"FLANT는 filament와 plant를 결합한 3D 프린팅 화분 커스텀 브랜드로, 다양한 소재와 텍스처를 활용해 어떤 인테리어에도 자연스럽게 어우러지며 구조적·기능적 설계를 통해 식물의 건강한 생장을 돕는 것이 특징이다. 모듈형 디자인과 정교한 프린팅 디테일로 사용자의 취향과 식물의 요구에 맞춘 맞춤 구성이 가능하다. 또한 지속가능한 소재 활용을 통해 디자인성과 친환경성을 동시에 추구한다."},{"k":"en","html":"FLANT is a custom planter brand that merges “filament” and “plant,” using diverse materials and textures to naturally blend into any interior while supporting healthy plant growth through structural and functional design. Its modular architecture and precise 3D-printing details enable customizable configurations tailored to individual preferences and plant needs. It also pursues both design quality and sustainability through the use of eco-friendly materials."}],"cells":[{"src":"/assets/img/projects/p04-flant/img-03.webp","x":90.4,"y":19,"w":77.6,"h":108.2,"cap":"03"},{"src":"/assets/img/projects/p04-flant/img-04.jpg","x":171,"y":19,"w":116.5,"h":108.2,"cap":"04"},{"src":"/assets/img/projects/p04-flant/img-06.jpg","x":90.4,"y":130.2,"w":197.2,"h":71.2,"cap":"06"}]},{"sec":"","text":[{"k":"p","html":"이 브랜드는 자연을 닮은 디자인으로 환경을 생각합니다. 원하는 대로 바꿀 수 있는 유연한 디자인이 특징입니다. 물건을 만들 때 버리는 것을 줄이고 오래 쓸 수 있게 합니다. 깨끗하고 단순함을 추구하며, 지구와 사람 모두를 위한 지속 가능한 가치를 만듭니다."},{"k":"en","html":"This brand is committed to Sustainability through a design philosophy inspired by nature (Nature-Engineered Design). It offers Modular Customization, giving users aesthetic appeal and flexibility. This is coupled with Eco-Conscious Innovation to ensure precise, low-waste, and minimalist products. Ultimately, the brand aims to create functional, versatile, and environmentally friendly designs for a sustainable future."}],"cells":[{"src":"/assets/img/projects/p04-flant/img-07.jpeg","x":90.2,"y":19,"w":130.7,"h":130.7,"cap":"08-1"},{"src":"/assets/img/projects/p04-flant/img-08.jpeg","x":223.9,"y":19,"w":63.9,"h":63.9,"cap":"08-2"},{"src":"/assets/img/projects/p04-flant/img-09.jpeg","x":223.9,"y":85.9,"w":63.9,"h":63.9,"cap":"08-3"}]},{"sec":"","text":[{"k":"p","html":"플래니는 식물이 자라듯 느긋하고 따뜻하며 뿌리처럼 의리 깊은 성격을 지녔고, 식물의 작은 신호를 잘 느껴 주변을 세심하게 돌보며 숲과 정원을 누비며 씨앗과 뿌리를 찾는 탐험을 즐기는, 말수는 적지만 배려가 깊은 조용한 동반자 같은 캐릭터다."},{"k":"en","html":"Flanny is gentle and warm-hearted like a slowly growing plant, loyal and grounded like roots, sensitive to subtle signals from nature, and enjoys quietly exploring forests and gardens in search of seeds and roots, all while caring for those around them with few words but deep consideration."}],"cells":[{"src":"/assets/img/projects/p04-flant/bh-10.jpg","x":95.1,"y":19,"w":84.7,"h":56.3,"cap":"11"},{"src":"/assets/img/projects/p04-flant/bh-11.webp","x":182.9,"y":19,"w":100,"h":56.3,"cap":"12"},{"src":"/assets/img/projects/p04-flant/img-15.webp","x":95.1,"y":78.3,"w":84,"h":56,"cap":"14"},{"src":"/assets/img/projects/p04-flant/bh-14.jpg","x":182.1,"y":78.3,"w":100.7,"h":56,"cap":"15"},{"src":"/assets/img/projects/p04-flant/img-16.webp","x":95.1,"y":137.3,"w":92.4,"h":64.1,"cap":"16"},{"src":"/assets/img/projects/p04-flant/img-17.webp","x":190.5,"y":137.3,"w":92.4,"h":64.1,"cap":"17"}]},{"sec":"","text":[{"k":"p","html":"FLANT는 체계적인 4가지 맞춤 영양분과 귀여운 버섯/나뭇잎 디자인 어댑터가 특징인 프리미엄 식물 영양제입니다. 기능성과 더불어 시각적인 즐거움을 주며, 실내 식물 관리를 효율적이고 감각적으로 만들어 줍니다."},{"k":"en","html":"FLANT is a premium plant supplement brand featuring four systematic and specialized nutrient types delivered through adorable, designer adapters (mushroom/leaf shapes). It combines functionality with aesthetic pleasure, making indoor plant care efficient and delightful."}],"cells":[{"src":"/assets/img/projects/p04-flant/img-19.png","x":115.8,"y":19,"w":71.8,"h":89.7,"cap":"20-1"},{"src":"/assets/img/projects/p04-flant/img-20.png","x":190.5,"y":19,"w":71.8,"h":89.7,"cap":"20-2"},{"src":"/assets/img/projects/p04-flant/img-21.png","x":115.8,"y":111.7,"w":71.8,"h":89.7,"cap":"20-3"},{"src":"/assets/img/projects/p04-flant/img-22.png","x":190.5,"y":111.7,"w":71.8,"h":89.7,"cap":"20-4"}]},{"sec":"","cells":[{"src":"/assets/img/projects/p04-flant/img-23.webp","x":21.3,"y":19,"w":254.4,"h":53,"cap":"21"},{"src":"/assets/img/projects/p04-flant/img-24.png","x":21.3,"y":75,"w":73.1,"h":126.4,"cap":"22-1"},{"src":"/assets/img/projects/p04-flant/img-25.png","x":97.4,"y":75,"w":178.2,"h":126.4,"cap":"22-2"}]},{"sec":"","cells":[{"src":"/assets/img/projects/p04-flant/img-13.jpeg","x":56.6,"y":19,"w":183.7,"h":132.9,"cap":"24"},{"src":"/assets/img/projects/p04-flant/bh-24.webp","x":56.6,"y":154.9,"w":183.7,"h":46.5,"cap":"25"}]}],"misfortune":[{"open":1,"desc":["불행상속(Misfortune Inheritance)은 가정폭력의 세대 간 전이를 고찰하고, 그 고리를 끊기 위한 방안을 제안하는 캠페인 및 컨퍼런스 키비주얼 디자인 프로젝트다.","엽서와 설문 책자 등 편집 디자인에 집중했으며, 팀 프로젝트로서 초기 단계에서 논리적 구조를 정립해 콘셉트의 일관성을 유지하며 그래픽을 전개했다."],"cells":[{"src":"/assets/img/projects/p05-unfortune/img-01.jpg","x":144.9,"y":19,"w":128.8,"h":182.4,"cap":"Unfortune"}]},{"sec":"","cells":[{"src":"/assets/img/projects/p05-unfortune/img-02.jpg","x":9.2,"y":19,"w":109.2,"h":167.2,"cap":"01"},{"src":"/assets/img/projects/p05-unfortune/bh-01.jpg","x":121.4,"y":19,"w":166.4,"h":79.9,"cap":"02"},{"src":"/assets/img/projects/p05-unfortune/bh-02.jpg","x":121.4,"y":101.9,"w":166.4,"h":84.4,"cap":"03"}]},{"sec":"","cells":[{"src":"/assets/img/projects/p05-unfortune/bh-03.jpg","x":9.2," 19,"w":102.9,"h":58.8,"cap":"14"},{"src":"/assets/img/projects/p08-sipsi/bh-14.jpg","x":177,"y":80.8,"w":102.9,"h":58.8,"cap":"15"},{"src":"/assets/img/projects/p08-sipsi/bh-15.jpg","x":177,"y":142.6,"w":102.9,"h":58.8,"cap":"16"}]},{"sec":"","cells":[{"src":"/assets/img/projects/p08-sipsi/bh-16.jpg","x":25.5,"y":19,"w":121.5,"h":69.4,"cap":"17"},{"src":"/assets/img/projects/p08-sipsi/bh-17.jpg","x":150,"y":19,"w":121.5,"h":69.4,"cap":"18"},{"src":"/assets/img/projects/p08-sipsi/bh-18.jpg","x":25.5,"y":91.4,"w":246,"h":110,"cap":"19"}]}],"puffnote":[{"open":1,"desc":["PUFFNOTE는 '안주'라는 카테고리에 없던 시각 언어를 만든 브랜드 아이덴티티 프로젝트다. 술과 함께 먹는 짠맛 젤리라는 낯선 제품을, 사진 한 장 없이 인쇄 문법만으로 매대에서 식별되게 만들었다.","60년대 재즈 포스터와 레코드 슬리브의 편집 문법을 가져와 로고·컬러 시스템·패키지·응용 전반을 설계했다. 로고는 AI 없이 벡터로 직접 제도해 1.5 등비 시스템을 갖췄고, 목업 이미지는 AI 생성으로 브랜드 세계관을 시각화했다."],"cells":[{"src":"/assets/img/projects/p09-puffnote/v2-hero-deboss.webp","x":130.7,"y":19,"w":157.1,"h":87.7,"cap":"네이비 코튼 보드에 형압과 오렌지 박으로 찍은 심볼·워드마크 로고"}]},{"sec":"","text":[{"k":"pull","html":"술은 A면,<br>안주는 B면."},{"k":"fact","label":"Challenge","html":"젤리는 달고 안주는 기름지다. 그 사이의 짠맛 젤리는 카테고리도, 설득할 시각 언어도 없었다. 음식 사진은 오히려 \"간식\"으로 보이게 했다."},{"k":"fact","label":"Approach","html":"과포화된 안주 매대의 코드(음식 사진·고채도·정보 과밀)를 모두 지웠다. 3색과 인쇄 문법만 남겨 매대에서 유일하게 \"인쇄물처럼 보이는 제품\"을 만들었다."},{"k":"fact","label":"System","html":"재즈 레이블 구조를 이름에 심었다. TRACK 01–04, VOL.1 세트, LIVE 한정판, FEAT. 협업까지 SKU 확장이 번호와 색 교체만으로 끝난다."}],"cells":[{"src":"/assets/img/projects/p09-puffnote/v2-brand-flatlay.webp","x":90.2,"y":19,"w":197.6,"h":132.5,"cap":"VOL.1 세트 박스·파우치·코스터·카드·테이프로 구성한 브랜드 아이덴티티 시스템"}]},{"sec":"01 Product","text":[{"k":"head","num":"01","name":"Product","sub":"제품"},{"k":"p","html":"술과 함께 먹는 짠맛 젤리. 낯선 제품을 클로즈업으로 설명하지 않고, 밤의 바(bar) 테이블 위 장면으로 먼저 보여줍니다."}],"cells":[{"src":"/assets/img/projects/p09-puffnote/v2-product-dish.webp","x":95.3,"y":19,"w":110.3,"h":74,"cap":"네이비 위 세라믹 접시에 담긴 짠맛 젤리와 TRACK 01 파우치"},{"src":"/assets/img/projects/p09-puffnote/v2-jelly-macro.webp","x":208.7,"y":19,"w":74,"h":74,"cap":"빛을 머금은 짠맛 젤리 한 조각 매크로"},{"src":"/assets/img/projects/p09-puffnote/v2-jelly-lineup.webp","x":95.3,"y":96,"w":187.3,"h":105.4,"cap":"TRACK 01–04 맛별 젤리 라인업"}]},{"sec":"02 Logo","text":[{"k":"head","num":"02","name":"Logo","sub":"로고"},{"k":"p","html":"부풀어 오른 복어를 레코드 스핀들 위에 올린 심볼. 복어는 규제 식품이라 이름에서 빼고 심볼로만 남겼습니다. AI 없이 벡터로 직접 제도하고 1.5 등비 시스템으로 구조화했습니다."}],"cells":[{"src":"/assets/img/projects/p09-puffnote/v2-logo-letterpress.webp","x":90.2,"y":19,"w":106.2,"h":59.3,"cap":"심볼 4단계와 비율 가이드를 레터프레스로 찍은 교정지와 동판"},{"src":"/assets/img/projects/p09-puffnote/v2-logo-objects.webp","x":199.4,"y":19,"w":88.4,"h":59.3,"cap":"심볼을 황동 메달·에나멜 핀·스탬프로 제작한 오브제"},{"src":"/assets/img/projects/p09-puffnote/v2-logo-sign.webp","x":90.2,"y":81.3,"w":97.3,"h":72.7,"cap":"바 외벽의 백라이트 심볼·워드마크 사인"},{"src":"/assets/img/projects/p09-puffnote/v2-logo-guidebook.webp","x":190.5,"y":81.3,"w":97.3,"h":72.7,"cap":"브랜드 가이드북 로고 시스템 페이지: 심볼 4단계, 여백 규정"}]},{"sec":"03 Color &amp; Graphic","text":[{"k":"head","num":"03","name":"Color &amp; Graphic","sub":"컬러 · 그래픽 시스템"},{"k":"p","html":"색은 세 개뿐입니다. 컨덴스드 그로테스크 서체와 레코드 홈을 닮은 동심원 모티프로 시스템을 구성했습니다."},{"k":"swatches","list":[{"bg":"#0E1B33","name":"Midnight Navy","hex":"#0E1B33"},{"bg":"#F2EAD8","name":"Sleeve Cream","hex":"#F2EAD8"},{"bg":"#FF4A1C","name":"Burst Orange","hex":"#FF4A1C"}]}],"cells":[{"src":"/assets/img/projects/p09-puffnote/v2-color-type.webp","x":90.2,"y":19,"w":109.6,"h":61.2,"cap":"3색 컬러 스와치와 컨덴스드 그로테스크 서체 견본"},{"src":"/assets/img/projects/p09-puffnote/v2-record-sleeve.webp","x":90.2,"y":83.2,"w":109.6,"h":109.6,"cap":"동심원 모티프를 적용한 레코드 슬리브"},{"src":"/assets/img/projects/p09-puffnote/v2-screenprint.webp","x":202.9,"y":19,"w":84.9,"h":63.4,"cap":"실크스크린으로 인쇄한 동심원 포스터"},{"src":"/assets/img/projects/p09-puffnote/v2-poster-gallery.webp","x":202.9,"y":85.4,"w":84.9,"h":47.4,"cap":"컬러 조합별 포스터 시리즈 전시"},{"src":"/assets/img/projects/p09-puffnote/v2-brand-book.webp","x":202.9,"y":135.9,"w":84.9,"h":57,"cap":"그래픽 시스템을 펼친 브랜드북 스프레드"}]},{"sec":"04 Packaging","text":[{"k":"head","num":"04","name":"Packaging","sub":"패키지"},{"k":"p","html":"레코드 한 장처럼 맛마다 TRACK 번호를 붙인 파우치. 앞면은 고지·주제·정보 3분할 밴드, 뒷면은 페어링 매트릭스와 필수표기 패널로 설계했습니다. 전개도와 판 구성까지 정리해, 신규 맛은 별색판 1개 교체로 추가됩니다."}],"cells":[{"src":"/assets/img/projects/p09-puffnote/v2-pouch-vinyl.webp","x":90.2,"y":19,"w":99.8,"h":74.6,"cap":"레코드판에 기댄 TRACK 01 명란 버터 파우치"},{"src":"/assets/img/projects/p09-puffnote/v2-pouch-front-back.webp","x":90.2,"y":96.6,"w":99.8,"h":67,"cap":"파우치 앞면과 페어링 매트릭스가 담긴 뒷면"},{"src":"/assets/img/projects/p09-puffnote/v2-back-label.webp","x":193.1,"y":19,"w":94.7,"h":70.8,"cap":"뒷면 헤드라인·페어링 매트릭스·영양정보 패널 디테일"},{"src":"/assets/img/projects/p09-puffnote/v2-press-sheet.webp","x":193.1,"y":92.8,"w":94.7,"h":70.8,"cap":"라이트 테이블 위 파우치 전개도 인쇄 교정지와 완성 파우치"}]},{"sec":"04 Packaging","cells":[{"src":"/assets/img/projects/p09-puffnote/v2-sku-range.webp","x":17.5,"y":19,"w":148.1,"h":82.7,"cap":"TRACK 01–04 SKU 파우치 라인업"},{"src":"/assets/img/projects/p09-puffnote/v2-print-spec.webp","x":168.7,"y":19,"w":110.8,"h":82.7,"cap":"별색 스와치·교정 컬러바·재질 샘플로 정리한 인쇄 사양"},{"src":"/assets/img/projects/p09-puffnote/v2-setbox.webp","x":17.5,"y":104.7,"w":129.5,"h":96.7,"cap":"앨범 슬리브 형태의 VOL.1 세트 박스와 내부 구성"},{"src":"/assets/img/projects/p09-puffnote/v2-shipbox.webp","x":150,"y":104.7,"w":129.5,"h":96.7,"cap":"심볼 테이프로 봉한 크래프트 배송 박스"}]},{"sec":"05 Touchpoints","text":[{"k":"head","num":"05","name":"Touchpoints","sub":"브랜드 경험"},{"k":"p","html":"페어링 카드, 코스터, 스테이셔너리까지 술을 마시는 시간 전체에서 브랜드를 만나도록 확장했습니다. 재질은 비도공지·매트 필름·골판지, 광택은 쓰지 않았습니다."}],"cells":[{"src":"/assets/img/projects/p09-puffnote/v2-guide-cards.webp","x":90.2,"y":19,"w":85.1,"h":47.5,"cap":"레터프레스로 인쇄한 페어링·플레이버·텍스처·강도 안내 카드 4종"},{"src":"/assets/img/projects/p09-puffnote/v2-coasters.webp","x":90.2,"y":69.5,"w":85.1,"h":47.5,"cap":"바 카운터 위의 넘버링 코스터 4종과 술잔"},{"src":"/assets/img/projects/p09-puffnote/v2-bar-table.webp","x":90.2,"y":120.1,"w":85.1,"h":57.1,"cap":"바 테이블 위의 파우치와 페어링 카드"},{"src":"/assets/img/projects/p09-puffnote/v2-hands.webp","x":178.4,"y":19,"w":109.4,"h":73.4,"cap":"파우치를 뜯는 손"},{"src":"/assets/img/projects/p09-puffnote/v2-materials.webp","x":178.4,"y":95.4,"w":109.4,"h":81.7,"cap":"비도공지·매트 필름·골판지 재질 보드"}]},{"sec":"06 Space","text":[{"k":"head","num":"06","name":"Space","sub":"공간 · 사람"},{"k":"p","html":"플래그십 팝업은 레코드 숍처럼 TRACK을 고르는 공간입니다. 사람이 들어간 장면으로 브랜드가 실제로 쓰이는 순간을 보여줍니다."}],"cells":[{"src":"/assets/img/projects/p09-puffnote/v2-popup.webp","x":125.7,"y":19,"w":126.5,"h":84.9,"cap":"레코드 숍처럼 TRACK을 고르는 플래그십 팝업"},{"src":"/assets/img/projects/p09-puffnote/v2-friends.webp","x":125.7,"y":106.9,"w":126.5,"h":94.5,"cap":"술잔과 파우치를 나누는 테이블"}]}],"wkf":[{"open":1,"desc":["주제 'The Promethean Moment'를 불꽃 그라데이션의 세로 기둥으로 만들고, 인쇄물·웹·굿즈·현장 사인까지 같은 규칙으로 적용했습니다.","키비주얼은 콘셉트부터 최종 아트워크까지 전담해 제작했고, 비주얼 가이드 문서와 소책자·리플렛·웰컴키트 등 지류 편집물을 직접 디자인했습니다."],"cells":[{"src":"/assets/img/projects/p13-wkf2026/kv-hero.jpg","x":130.7,"y":19,"w":157.1,"h":88.3,"cap":"The Promethean Moment 키비주얼"}]},{"sec":"01 Theme","text":[{"k":"pull","html":"The Promethean Moment:<br>Architecting the Co-Intelligence Order"},{"k":"head","num":"01","name":"Theme"},{"k":"p","html":"인간에게 불을 건넨 프로메테우스의 신화를 AI 시대에 빗댄 주제입니다. 키비주얼은 문장 속 두 단어, 불과 지능을 하나의 형태로 묶는 데서 출발했습니다."}],"cells":[{"src":"/assets/img/projects/p13-wkf2026/kv-background.jpg","x":90.2,"y":19,"w":197.6,"h":111.1,"cap":"타이포 없이 쓰는 키비주얼 배경"}]},{"sec":"02 Form","text":[{"k":"head","num":"02","name":"Form"},{"k":"p","html":"불꽃 그라데이션을 같은 폭의 기둥으로 자르고, 기둥마다 높이를 달리했습니다. 멀리서는 불꽃으로, 가까이서는 막대그래프로 읽힙니다."}],"cells":[{"src":"/assets/img/projects/p13-wkf2026/form-construction.webp","x":93.8,"y":19,"w":190.3,"h":182.4,"cap":"불꽃 그라데이션을 같은 폭 15개 기둥과 망점으로 바꾸는 구성, 멀리서는 불꽃·가까이서는 막대그래프"}]},{"sec":"03 System","text":[{"k":"head","num":"03","name":"System"},{"k":"p","html":"메인 3색과 서브 3색, 배경 밝기에 따라 바꿔 쓰는 다크·레드 두 버전. 규칙은 7쪽 가이드로 정리해 PCO와 제작 업체에 전달했습니다."},{"k":"swatches","list":[{"bg":"#330204","name":"Dark","hex":"#330204"},{"bg":"#E61F19","name":"Red","hex":"#E61F19"},{"bg":"#F2EE71","name":"Yellow","hex":"#F2EE71"},{"bg":"#E51C27","name":"Sub Red","hex":"#E51C27"},{"bg":"#F4E78E","name":"Sub Yellow","hex":"#F4E78E"},{"bg":"#BAE1EA","name":"Sub Blue","hex":"#BAE1EA"}]}],"cells":[{"src":"/assets/img/projects/p13-wkf2026/guide-color.jpg","x":91.3,"y":19,"w":129,"h":182.4,"cap":"Guide — colour"},{"src":"/assets/img/projects/p13-wkf2026/guide-layout.jpg","x":223.3,"y":19,"w":63.4,"h":89.7,"cap":"Guide — layout, blend modes"},{"src":"/assets/img/projects/p13-wkf2026/guide-variation.jpg","x":223.3,"y":111.7,"w":63.4,"h":89.7,"cap":"Guide — variations"}]},{"sec":"04 Print","text":[{"k":"head","num":"04","name":"Print"},{"k":"p","html":"국·영문 소책자와 리플렛. 표지는 기둥과 세로 제목으로 채우고, 내지는 흰 바탕에 붉은 제목만 남겼습니다."}],"cells":[{"src":"/assets/img/projects/p13-wkf2026/mock-booklet.jpg","x":110.4,"y":19,"w":157.2,"h":87.8,"cap":"소책자"},{"src":"/assets/img/projects/p13-wkf2026/book/page-00.webp","x":110.4,"y":109.8,"w":50.4,"h":91.6,"cap":"소책자 앞표지"},{"src":"/assets/img/projects/p13-wkf2026/book/page-01.webp","x":163.8,"y":109.8,"w":50.4,"h":91.6,"cap":"소책자 내지 — 표지 안쪽"},{"src":"/assets/img/projects/p13-wkf2026/book/page-02.webp","x":217.2,"y":109.8,"w":50.4,"h":91.6,"cap":"소책자 내지 — 회장 인사말"}]},{"sec":"04 Print","cells":[{"src":"/assets/img/projects/p13-wkf2026/book/page-03.webp","x":9.2,"y":19,"w":67.4,"h":122.5,"cap":"소책자 내지 — 포럼 소개"},{"src":"/assets/img/projects/p13-wkf2026/book/page-04.webp","x":79.6,"y":19,"w":67.4,"h":122.5,"cap":"소책자 내지 — 숫자로 보는 세계지식포럼"},{"src":"/assets/img/projects/p13-wkf2026/book/page-05.webp","x":150,"y":19,"w":67.4,"h":122.5,"cap":"소책자 내지 — 2026 주제"},{"src":"/assets/img/projects/p13-wkf2026/book/page-06.webp","x":220.4,"y":19,"w":67.4,"h":122.5,"cap":"소책자 내지 — 현장 사진"}]},{"sec":"04 Print","cells":[{"src":"/assets/img/projects/p13-wkf2026/book/page-07.webp","x":9.2,"y":19,"w":90.9,"h":165.2,"cap":"소책자 내지 — 주요 연사 소개"},{"src":"/assets/img/projects/p13-wkf2026/book/page-08.webp","x":103.1,"y":19,"w":90.9,"h":165.2,"cap":"소책자 내지 — 주요 연사 소개"},{"src":"/assets/img/projects/p13-wkf2026/book/ "src":"/assets/img/projects/p13-wkf2026/youtube-thumbnail.jpg","x":190.5,"y":135.5,"w":97.3,"h":54.7,"cap":"YouTube thumbnail"}]},{"sec":"06 Goods","text":[{"k":"head","num":"06","name":"Goods"},{"k":"p","html":"키트의 물건마다 불꽃을 다른 형태로 바꿨습니다. 웰컴카드는 세션장마다 공개되는 불꽃 색을 찾아 스티커로 채우는 현장 이벤트 \"프로메테우스의 불꽃을 찾아라\"의 정답 카드가 되고, 완성한 카드는 기념 티셔츠로 돌아옵니다."}],"cells":[{"src":"/assets/img/projects/p13-wkf2026/kit-card-43.webp","x":108.8,"y":19,"w":160.5,"h":120.3,"cap":"Welcome card — 정답 카드"},{"src":"/assets/img/projects/p13-wkf2026/kit-sticker-43.webp","x":108.8,"y":142.3,"w":78.8,"h":59.1,"cap":"Flame stickers"},{"src":"/assets/img/projects/p13-wkf2026/kit-note-photo.webp","x":190.5,"y":142.3,"w":78.8,"h":59.1,"cap":"Notebook"}]},{"sec":"06 Goods","text":[{"k":"p","html":"프로메테우스의 불꽃을 찾아라"},{"k":"p","html":"9.8–9.9 · 11:00–18:00 · 가든 스테이지 이벤트 부스 · 모바일 웹 병행"},{"k":"p","html":"불꽃 찾기"},{"k":"p","html":"구독 인증"},{"k":"p","html":"경품 추첨"}],"cells":[{"src":"/assets/img/projects/p13-wkf2026/event-web-main.webp","x":90.2,"y":19,"w":63.9,"h":138.2,"cap":"Mobile web — 참여 순서"},{"src":"/assets/img/projects/p13-wkf2026/event-web-mission.webp","x":157.1,"y":19,"w":63.9,"h":138.2,"cap":"Mission 1 — 온라인 정답 카드"},{"src":"/assets/img/projects/p13-wkf2026/event-web-info.webp","x":223.9,"y":19,"w":63.9,"h":138.2,"cap":"응모 방법 · FAQ"}]},{"sec":"06 Goods","text":[{"k":"p","html":"미션 1 완료 선물, 기념 티셔츠.<br>등판에 하프톤 레드 버전을 인쇄해<br>행사장 안에서 키비주얼을 노출하는 매체로 활용했습니다."}],"cells":[{"src":"/assets/img/projects/p13-wkf2026/tee-onsite.webp","x":90.2,"y":19,"w":107.8,"h":133.9,"cap":"가든 스테이지에서 기념 티셔츠를 입은 참가자"},{"src":"/assets/img/projects/p13-wkf2026/kit-photo-1.jpg","x":201.1,"y":19,"w":86.7,"h":65.4,"cap":"이벤트 키트 구성품"},{"src":"/assets/img/projects/p13-wkf2026/kit-photo-2.jpg","x":201.1,"y":87.4,"w":86.7,"h":65.4,"cap":"이벤트 키트 플랫레이"}]},{"sec":"07 Signage","text":[{"k":"head","num":"07","name":"Signage"},{"k":"p","html":"현수기와 대형 현수막, 장충아레나 외벽 통천까지 같은 기둥 그래픽을 건물 크기로 키웠습니다."}],"cells":[{"src":"/assets/img/projects/p13-wkf2026/banner-photo.webp","x":105.8,"y":19,"w":80.3,"h":60.2,"cap":"도심 빌딩에 걸린 대형 현수막 실물"},{"src":"/assets/img/projects/p13-wkf2026/banner-design.jpg","x":189,"y":19,"w":83.3,"h":60.2,"cap":"대형 현수막 디자인"},{"src":"/assets/img/projects/p13-wkf2026/flag-mockup.webp","x":105.8,"y":82.2,"w":81.8,"h":54.5,"cap":"거리 가로등에 걸린 현수기 목업, 키비주얼과 연사 현수기 네 세트"},{"src":"/assets/img/projects/p13-wkf2026/flag-layout.webp","x":190.5,"y":82.2,"w":81.8,"h":54.5,"cap":"가로등 현수기 디자인 구성 — 왼쪽 키비주얼 1종과 오른쪽 연사 7종의 레이아웃"},{"src":"/assets/img/projects/p13-wkf2026/venue-exterior-2.jpg","x":105.8,"y":139.7,"w":81.8,"h":61.7,"cap":"해 질 녘 장충아레나 외벽 통천"},{"src":"/assets/img/projects/p13-wkf2026/venue-exterior-3.jpg","x":190.5,"y":139.7,"w":81.8,"h":61.7,"cap":"장충아레나 입구의 WELCOME 배너"}]},{"sec":"08 On Site","text":[{"k":"head","num":"08","name":"On Site"},{"k":"p","html":"신라호텔과 장충아레나에서 사흘간. 무대 LED부터 안내 데스크, 이벤트 부스까지 같은 그래픽이 이어졌습니다."}],"cells":[{"src":"/assets/img/projects/p13-wkf2026/hall-2.jpg","x":91,"y":19,"w":119.6,"h":89.7,"cap":"세션장 무대 LED"},{"src":"/assets/img/projects/p13-wkf2026/hall-main.jpg","x":91,"y":111.7,"w":119.6,"h":89.7,"cap":"Main hall"},{"src":"/assets/img/projects/p13-wkf2026/hall-3.jpg","x":213.6,"y":19,"w":73.5,"h":55.5,"cap":"Session hall"},{"src":"/assets/img/projects/p13-wkf2026/detail-desk.jpg","x":213.6,"y":77.5,"w":73.5,"h":65.5,"cap":"Hall podium"},{"src":"/assets/img/projects/p13-wkf2026/desk-2.jpg","x":213.6,"y":145.9,"w":73.5,"h":55.5,"cap":"Registration desk"}]},{"sec":"08 On Site","cells":[{"src":"/assets/img/projects/p13-wkf2026/booth.jpg","x":10.2,"y":19,"w":136.8,"h":182.4,"cap":"Event booth — garden stage"},{"src":"/assets/img/projects/p13-wkf2026/booth-2.jpg","x":150,"y":19,"w":136.8,"h":182.4,"cap":"Event booth — banner"}]}],"hardcopy":[{"open":1,"desc":["전력망이 끊긴 도시에서 읽기를 전력에서 분리하는 출판 브랜드다. 잔해에서 잘라낸 규격 판에 정보를 잉크 대신 양각으로 새겨, 전원도 광원도 없이 손으로 읽는 매체를 설계했다.","'재료는 생산되지 않고 회수된다'는 설정 하나가 제품 규격·패키지·그래픽·카피 전부를 지시하도록 만들었다. 로고 '단층 마크' 역시 제품을 그리지 않고 제품을 만드는 규칙을 그려, 심볼과 문자의 생성 원리를 하나로 묶었다."],"cells":[{"src":"/assets/img/projects/p10-hardcopy/img-01.png","x":130.7,"y":19,"w":157.1,"h":87.7,"cap":"01"}]},{"sec":"","cells":[{"src":"/assets/img/projects/p10-hardcopy/img-02.png","x":20.9,"y":19,"w":132.6,"h":49.5,"cap":"02"},{"src":"/assets/img/projects/p10-hardcopy/img-03.png","x":156.4,"y":19,"w":119.7,"h":49.5,"cap":"03"},{"src":"/assets/img/projects/p10-hardcopy/img-04.png","x":20.9,"y":71.5,"w":122.2,"h":79.8,"cap":"04"},{"src":"/assets/img/projects/p10-hardcopy/img-05.png","x":146,"y":71.5,"w":130.1,"h":79.8,"cap":"05"},{"src":"/assets/img/projects/p10-hardcopy/img-06.png","x":20.9,"y":154.3,"w":126.1,"h":47.1,"cap":"06"},{"src":"/assets/img/projects/p10-hardcopy/img-07.png","x":150,"y":154.3,"w":126.1,"h":47.1,"cap":"07"}]},{"sec":"","cells":[{"src":"/assets/img/projects/p10-hardcopy/img-08.webp","x":11.7,"y":19,"w":80,"h":99.4,"cap":"08"},{"src":"/assets/img/projects/p10-hardcopy/img-09.webp","x":11.7,"y":121.4,"w":80,"h":80,"cap":"09"},{"src":"/assets/img/projects/p10-hardcopy/img-10.webp","x":94.7,"y":19,"w":93.8,"h":62.9,"cap":"10"},{"src":"/assets/img/projects/p10-hardcopy/img-11.webp","x":94.7,"y":84.9,"w":93.8,"h":116.5,"cap":"11"},{"src":"/assets/img/projects/p10-hardcopy/img-12.webp","x":191.5,"y":19,"w":93.8,"h":116.5,"cap":"12"},{"src":"/assets/img/projects/p10-hardcopy/img-13.webp","x":191.5,"y":138.5,"w":93.8,"h":62.9,"cap":"13"}]},{"sec":"","cells":[{"src":"/assets/img/projects/p10-hardcopy/img-14.webp","x":9.2,"y":19,"w":131.3,"h":88.1,"cap":"14"},{"src":"/assets/img/projects/p10-hardcopy/img-15.webp","x":9.2,"y":110.1,"w":131.3,"h":88.1,"cap":"15"},{"src":"/assets/img/projects/p10-hardcopy/img-16.webp","x":143.5,"y":19,"w":144.3,"h":179.2,"cap":"16"}]}],"gimpick":[{"open":1,"desc":["GIMPICK은 김밥을 한 줄이 아닌 '조각'으로 골라 담는 테이크아웃 김밥 브랜드다. 김밥 한 줄은 양이 많고 맛이 고정된다는 불편에서 출발해, 즉석에서 두껍게 자른 단면을 원하는 만큼 조합하는 경험을 설계했다.","자른 김밥의 단면을 단청의 화형(花形) 문법으로 읽어 로고와 패턴을 만들고, 빈티지 미국 다이너의 체커보드와 굵은 타이포를 더해 '한국적이지만 촌스럽지 않은' 시각 언어를 구축했다. 로고·패키지·응용물은 벡터로 직접 제도했고, 사용 장면 목업은 AI 이미지 생성으로 시각화했다."],"cells":[{"src":"/assets/img/projects/p11-gimpick/board-hero.jpg","x":130.7,"y":19,"w":157.1,"h":88.3,"cap":"코랄 배경 위의 심볼과 워드마크 조합 로고"}]},{"sec":"","text":[{"k":"pull","html":"한 줄 말고,<br>낱개로."},{"k":"fact","label":"Insight","html":"김밥 한 줄은 혼자 먹기엔 많고, 맛은 하나로 고정된다. 여러 맛을 조금씩 먹고 싶은 도심 소비자에게는 맞지 않는 단위다."},{"k":"fact","label":"Idea","html":"조각 단위로 진열하고 가격을 매긴다. 오픈 커팅 스테이션에서 바로 자른 단면이 곧 브랜드의 얼굴이 된다."},{"k":"fact","label":"Design","html":"정체성은 한국(단청 화형), 스타일은 빈티지 미국 다이너. 새 색·새 도형 없이 토큰 재사용만으로 모든 응용을 만든다."}],"cells":[]},{"sec":"01 Insight","text":[{"k":"head","num":"01","name":"Insight","sub":"단면 중심의 진열"},{"k":"p","html":"김밥을 자르면 원 안에 재료가 꽃처럼 펼쳐집니다. USP는 세 가지: 한 줄 말고 낱개로(조각당 진열·가격), 자른 단면이 곧 얼굴(오픈 커팅 스테이션), 매일 즉석(생산 시각 표기)."}],"cells":[{"src":"/assets/img/projects/p11-gimpick/moodboard.jpg","x":98,"y":19,"w":182,"h":102.4,"cap":"다양한 맛의 김밥 단면 무드보드"},{"src":"/assets/img/projects/p11-gimpick/cutting-station.jpg","x":98,"y":124.4,"w":102,"h":77,"cap":"즉석에서 두껍게 자르는 커팅 스테이션"},{"src":"/assets/img/projects/p11-gimpick/pick-tray-photo.jpg","x":203,"y":124.4,"w":77,"h":77,"cap":"여러 맛을 골라 담은 접시"}]},{"sec":"02 Logo","text":[{"k":"head","num":"02","name":"Logo","sub":"단청의 화형을 규칙으로"},{"k":"p","html":"단청 머리초의 색 구획 방식을 따라 좌우 대칭 연화형 꽃잎 4장에 먹선을 두르고, 꽃잎 사이에 황색 휘점을 넣었습니다. 지름 12모듈 그리드, 클리어 스페이스는 스트로크 1모듈. 28px 미만에서는 적/녹 반원으로 단순화합니다."}],"cells":[{"src":"/assets/img/projects/p11-gimpick/board-construction.jpg","x":109.3,"y":19,"w":159.5,"h":89.7,"cap":"12모듈 심볼 구조와 클리어 스페이스 가이드"},{"src":"/assets/img/projects/p11-gimpick/board-variants.jpg","x":109.3,"y":111.7,"w":159.5,"h":89.7,"cap":"풀컬러·모노크롬·리버스·앱 아이콘 베리에이션"}]},{"sec":"03 Shape &amp; Color","text":[{"k":"head","num":"03","name":"Shape &amp; Color","sub":"로제트 · 컬러 시스템"},{"k":"p","html":"로고는 꽃잎 4장, 단면 패턴은 외곽 8장과 내곽 8장의 2중 로제트입니다. 맛이 늘어나도 새 도형은 만들지 않고 색 조합만 바꿉니다. 체커보드는 띠로만 쓰고 전체 배경에는 쓰지 않습니다."},{"k":"swatches","list":[{"bg":"#FF4B3E","name":"Primary · Coral","hex":"#FF4B3E"},{"bg":"#1A1A1A","name":"Secondary · Ink","hex":"#1A1A1A"},{"bg":"#FFC53D","name":"Accent · Yellow","hex":"#FFC53D"},{"bg":"#1FA37A","name":"Support · Green","hex":"#1FA37A"},{"bg":"#F2E9DD","name":"Neutral · Rice","hex":"#F2E9DD"}]}],"cells":[{"src":"/assets/img/projects/p11-gimpick/board-rosette.jpg","x":90.2,"y":19,"w":197.6,"h":111.1,"cap":"로고 마크, 단면 로제트, 맛별 로제트 비교"}]},{"sec":"04 Packaging","text":[{"k":"head","num":"04","name":"Packaging","sub":"픽 트레이"},{"k":"p","html":"4조각을 2×2 원형 모듈로 담는 170×120mm 트레이. 진열 자체가 곧 패턴이 되고, 칸마다 맛·가격·칼로리가 인쇄됩니다. 상단에는 다이너 체커보드 밴드를 얹었습니다."}],"cells":[{"src":"/assets/img/projects/p11-gimpick/board-tray.jpg","x":92.6,"y":19,"w":192.9,"h":108.5,"cap":"픽 트레이 패키지 전개 그래픽"},{"src":"/assets/img/projects/p11-gimpick/tray-hand.jpg","x":92.6,"y":130.5,"w":95,"h":70.9,"cap":"김밥 4조각이 담긴 픽 트레이를 든 손"},{"src":"/assets/img/projects/p11-gimpick/tray-front.jpg","x":190.5,"y":130.5,"w":95,"h":70.9,"cap":"정면에서 본 픽 트레이"}]},{"sec":"05 Print &amp; Digital","text":[{"k":"head","num":"05","name":"Print &amp; Digital","sub":"포스터 · 배달앱 · 메뉴"},{"k":"p","html":"포스터에는 Baloo 2 헤드라인, Anton 배지, 16방향 버스트로 다이너 포스터 문법을 얹었습니다. 같은 시스템을 배달앱 1:1 썸네일과 메뉴판으로 재구성했습니다."}],"cells":[{"src":"/assets/img/projects/p11-gimpick/board-print.jpg","x":112.4,"y":19,"w":153.2,"h":86.2,"cap":"프로모 포스터, 배달앱 썸네일, 메뉴판 그래픽"},{"src":"/assets/img/projects/p11-gimpick/poster-wall.jpg","x":112.4,"y":108.2,"w":75.1,"h":93.2,"cap":"골목 벽에 붙은 MIX YOUR OWN ROLL 포스터"},{"src":"/assets/img/projects/p11-gimpick/delivery-phone.jpg","x":190.5,"y":108.2,"w":75.1,"h":93.2,"cap":"배달앱 썸네일과 종이 봉투"}]},{"sec":"06 Collateral","text":[{"k":"head","num":"06","name":"Collateral","sub":"굿즈 · 스테이셔너리"},{"k":"p","html":"명함, 8칸 스탬프 카드, 스티커, 텀블러, 소스 포션컵. 소스는 글자 없이 뚜껑 색만으로 맛을 구분합니다."}],"cells":[{"src":"/assets/img/projects/p11-gimpick/board-cards.jpg","x":90.2,"y":19,"w":197.6,"h":111.1,"cap":"명함과 스탬프 카드 앞·뒷면"},{"src":"/assets/img/projects/p11-gimpick/cards-flatlay.jpg","x":90.2,"y":133.1,"w":111.3,"h":62.1,"cap":"명함과 스탬프 카드 플랫레이"},{"src":"/assets/img/projects/p11-gimpick/tumbler-sauce.jpg","x":204.6,"y":133.1,"w":83.2,"h":62.1,"cap":"리유저블 텀블러와 소스 포션컵"}]},{"sec":"07 Space","text":[{"k":"head","num":"07","name":"Space","sub":"매장"},{"k":"p","html":"조각 진열대와 오픈 커팅 스테이션이 매장의 중심입니다. 손님은 메뉴판을 보고 원하는 조각을 직접 집어 트레이에 담습니다."}],"cells":[{"src":"/assets/img/projects/p11-gimpick/menu-counter.jpg","x":108.6,"y":19,"w":160.8,"h":89.7,"cap":"메뉴판과 조각 진열대, 집게로 김밥을 담는 손님"},{"src":"/assets/img/projects/p11-gimpick/storefront.jpg","x":108.6,"y":111.7,"w":160.8,"h":89.7,"cap":"GIMPICK 매장 외관"}]}],"seolred":[{"open":1,"desc":["SEOLRED(설레드)는 1~2인 가구를 위한 소용량 사과 브랜드다. 10~15개 단위 박스가 다 먹기 전에 무르는 문제에서 출발해, 사과를 적게 파는 대신 '사과를 즐기는 방식'을 한 상자에 담았다.","사과꽃의 5장 꽃잎과 단면 씨방의 5각 별에서 '5의 기하학'을 찾아 로고·패키지 인서트·라인업을 하나의 구조로 묶었다. 사과의 뻔한 빨강 대신 과육의 핫핑크와, 상자를 열어야 보이는 딥그린을 택했다."],"cells":[{"src":"/assets/img/projects/p12-seolred/ed-hero.jpg","x":130.7,"y":19,"w":157.1,"h":87.6,"cap":"공중에서 분리되는 상자와 구성품"}]},{"sec":"","text":[{"k":"fact","label":"Problem","html":"사과는 10~15개 박스 단위로 팔린다. 1~2인 가구는 다 먹기 전에 무르고, 결국 사과를 사지 않게 된다."},{"k":"fact","label":"Idea","html":"사과 1알, 잼, 전용 스푼을 100mm 정사각 상자 하나에. 소분이 아니라 사과를 즐기는 경험 전체를 패키징한다."},{"k":"fact","label":"Design","html":"정서는 할머니 댁 사과 박스, 미감은 현대적인 1인 가구. 촌스럽지 않은 한국스러움을 핫핑크와 본 크림, 종이의 질감으로 표현했다."}],"cells":[]},{"sec":"01 Origin","text":[{"k":"head","num":"01","name":"Origin","sub":"사과 안에서 찾은 형태"},{"k":"p","html":"사과를 가로로 자르면 씨방이 5각 별로 나타나고, 사과꽃의 꽃잎도 5장입니다. 이 \"5\"가 로고의 방사형과 패키지 인서트의 꽃잎 분할로 이어집니다."}],"cells":[{"src":"/assets/img/projects/p12-seolred/ed-origin-apple.jpg","x":90.2,"y":19,"w":107.8,"h":107.8,"cap":"사과 단면의 5각 별과 심볼 작도"},{"src":"/assets/img/projects/p12-seolred/ed-origin-blossom.jpg","x":201,"y":19,"w":86.8,"h":107.8,"cap":"원형 심볼의 출발점, 사과 밑면 꽃받침"}]},{"sec":"02 Logo","text":[{"k":"head","num":"02","name":"Logo","sub":"수확일을 새긴 원형 심볼"},{"k":"p","html":"사과 밑면에서 출발한 원형 심볼입니다. 시침·분침 같은 방사형 장식을 10시 30분 방향에 두어 부사의 적정 수확일 10월 30일을 새겼습니다."}],"cells":[{"src":"/assets/img/projects/p12-seolred/board-symbols.jpg","x":98.4,"y":19,"w":98.2,"h":55.2,"cap":"그라데이션·솔리드·라인 심볼 베리에이션"},{"src":"/assets/img/projects/p12-seolred/board-wordmark.jpg","x":98.4,"y":77.2,"w":98.2,"h":55.2,"cap":"니어블랙 위의 Poppins Black 워드마크"},{"src":"/assets/img/projects/p12-seolred/ed-logo-brandbook.jpg","x":98.4,"y":135.5,"w":98.2,"h":65.9,"cap":"워드마크·심볼·패턴·컬러를 담은 브랜드 가이드북"},{"src":"/assets/img/projects/p12-seolred/ed-logo-deboss.jpg","x":199.6,"y":19,"w":80,"h":80,"cap":"뚜껑 원형 심볼과 타이포 링 매크로"},{"src":"/assets/img/projects/p12-seolred/ed-logo-sign.jpg","x":199.6,"y":102,"w":80,"h":99.4,"cap":"레터프레스 워드마크와 핑크 박 심볼 카드"}]},{"sec":"03 Color &amp; Material","text":[{"k":"head","num":"03","name":"Color &amp; Material","sub":"빨강 대신 핑크"},{"k":"p","html":"이름에 Red가 있지만 빨강은 쓰지 않았습니다. 과육의 핫핑크가 화면의 40~60%를 차지하고, 본 크림과 니어블랙이 받칩니다. 딥그린은 한 장면에 한 요소만, 상자를 열어야 나오는 색입니다."},{"k":"swatches","list":[{"bg":"#FF0055","name":"Hot Pink","hex":"#FF0055"},{"bg":"#FFF5E1","name":"Bone Cream","hex":"#FFF5E1"},{"bg":"#14171E","name":"Ink","hex":"#14171E"},{"bg":"#D50000","name":"Deep Red","hex":"#D50000"},{"bg":"#1B512D","name":"Pine Green","hex":"#1B512D"}]}],"cells":[{"src":"/assets/img/projects/p12-seolred/ed-material-board.jpg","x":90.2,"y":19,"w":86.8,"h":107.8,"cap":"보드·펄프·리본·박엽지 소재 견본"},{"src":"/assets/img/projects/p12-seolred/ed-material-paper.jpg","x":180,"y":19,"w":107.8,"h":107.8,"cap":"브랜드 컬러 페이퍼 단면 스택"}]},{"sec":"04 Package","text":[{"k":"head","num":"04","name":"Package","sub":"한 송이 상자 · 5분할 인서트"},{"k":"p","html":"100×100×60mm 정사각 상자 안에 5장 꽃잎으로 나눈 딥그린 인서트를 넣었습니다. 중앙에 사과 1알, 꽃잎에는 잼병·스푼·카드가 자리를 잡습니다. \"정사각 외피 안의 원\"이 곧 로고의 구조입니다."}],"cells":[{"src":"/assets/img/projects/p12-seolred/ed-pk-dieline.jpg","x":101.6,"y":19,"w":113.6,"h":72.3,"cap":"뚜껑·본체 전개도와 인쇄 그래픽"},{"src":"/assets/img/projects/p12-seolred/ed-pk-hero.jpg","x":218.2,"y":19,"w":58.3,"h":72.3,"cap":"원형 타이포와 대형 워드마크를 인쇄한 한 송이 상자"},{"src":"/assets/img/projects/p12-seolred/ed-pk-exploded.jpg","x":101.6,"y":94.3,"w":85.7,"h":107.1,"cap":"뚜껑·박엽지·꽃잎 인서트·본체 분해 구조도"},{"src":"/assets/img/projects/p12-seolred/ed-pk-opening.jpg",   raw.map((v,i)=>[v-cnt[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([,i])=>cnt[i]++);
  const out=[];
  stops.slice(0,-1).forEach((st,i)=>{const k=cnt[i]+1;for(let j=0;j<k;j++) out.push(L*(st+lens[i]*j/k))});
  if(!closed) out.push(L);
  return out;
}
function sample(d, open, f){
  sampler.setAttribute('d', d);
  const L = sampler.getTotalLength(), pt=l=>{const p=sampler.getPointAtLength(Math.min(l,L));return [p.x,p.y]};
  if(open){
    const fwd=along(L,f,N/2,false).map(pt);
    return fwd.concat(fwd.slice().reverse().map(p=>p.slice()));   // ping-pong → closed loop
  }
  const pts=along(L,f,N,true).map(pt);
  let a=0;for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N];a+=p[0]*q[1]-q[0]*p[1]}
  if(a<0) pts.reverse();                                          // clockwise
  let k=0;for(let i=1;i<N;i++){if(pts[i][1]<pts[k][1]-.01||(Math.abs(pts[i][1]-pts[k][1])<.01&&pts[i][0]<pts[k][0]))k=i}
  return pts.slice(k).concat(pts.slice(0,k));                      // start at top-left
}
const MAXS = Math.max(...Object.values(SYMBOLS).map(s=>s.shapes.length));
const MAXA = Math.max(...Object.values(SYMBOLS).map(s=>s.anchors.length));
const MAXSEL = Math.max(...Object.values(SYMBOLS).map(s=>s.sel.length));
const PREP = {};
for(const [id,s] of Object.entries(SYMBOLS)){
  const shapes = s.shapes.map(sh=>sample(sh.d, sh.open, sh.f));
  let cx=0,cy=0,n=0;shapes.forEach(ps=>ps.forEach(p=>{cx+=p[0];cy+=p[1];n++}));cx/=n;cy/=n;
  while(shapes.length<MAXS) shapes.push(Array.from({length:N},()=>[cx,cy]));   // collapsed slot
  const pad=(arr,m)=>Array.from({length:m},(_,i)=>arr[i%arr.length]);
  PREP[id]={shapes, anchors:pad(s.anchors,MAXA), sel:pad(s.sel,MAXSEL),
    exact:Array.from({length:MAXS},(_,i)=>s.shapes[i]?s.shapes[i].d:''), crisp:!!s.crisp};
}

/* ---------- SVG renderer ---------- */
const NS='http://www.w3.org/2000/svg';
function mkSym(svg, withBox){
  const el=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
  const r={svg,paths:[],anc:[],sel:[]};
  for(let i=0;i<MAXS;i++) r.paths.push(el('path',{class:'shape',pathLength:1}));
  for(let i=0;i<MAXA;i++) r.anc.push(el('rect',{class:'anc'}));
  for(let i=0;i<MAXSEL;i++) r.sel.push(el('rect',{class:'sel'}));
  if(withBox){
    const g=el('g',{class:'bbox'});r.box=g;
    r.boxRect=el('rect',{class:'box'},g);
    r.h=[...Array(8)].map(()=>el('rect',{class:'h'},g));
    r.tag=el('rect',{class:'tag'},g);r.tagT=el('text',{},g);
  }
  return r;
}
function unit(svg){ const w=svg.getBoundingClientRect().width||440, h=svg.getBoundingClientRect().height||300; return Math.max(440/w,300/h) }
const lerp=(a,b,t)=>a+(b-a)*t;
function drawSym(r, idA, idB, t){
  const A=PREP[idA],B=PREP[idB||idA],u=unit(r.svg);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const rest = idA===idB||t<.0005||t>.9995, R = t>.5?B:A;
  r.svg.setAttribute('shape-rendering', rest&&R.crisp?'crispEdges':'geometricPrecision');
  for(let s=0;s<MAXS;s++){
    if(rest){ r.paths[s].setAttribute('d',R.exact[s]); continue }      // at rest: original vector, no resampling
    const pa=A.shapes[s],pb=B.shapes[s];let d='';
    for(let i=0;i<N;i++){
      const x=lerp(pa[i][0],pb[i][0],t),y=lerp(pa[i][1],pb[i][1],t);
      d+=(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2);
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
    }
    r.paths[s].setAttribute('d',d+'Z');
  }
  const put=(list,a,b,size)=>list.forEach((rc,i)=>{
    const x=lerp(a[i][0],b[i][0],t),y=lerp(a[i][1],b[i][1],t);
    rc.setAttribute('x',x-size/2);rc.setAttribute('y',y-size/2);rc.setAttribute('width',size);rc.setAttribute('height',size);
  });
  put(r.anc,A.anchors,B.anchors,4*u);
  put(r.sel,A.sel,B.sel,10*u);
  if(r.box){
    const vis=Math.sin(Math.PI*t);r.box.style.opacity=vis>.02?Math.min(1,vis*1.6):0;
    if(rest) return;                                                  // no sampled points → no box to size
    const pad=10*u;x0-=pad;y0-=pad;x1+=pad;y1+=pad;
    Object.entries({x:x0,y:y0,width:x1-x0,height:y1-y0}).forEach(([k,v])=>r.boxRect.setAttribute(k,v));
    const hs=6*u,mx=(x0+x1)/2,my=(y0+y1)/2;
    [[x0,y0],[mx,y0],[x1,y0],[x1,my],[x1,y1],[mx,y1],[x0,y1],[x0,my]].forEach(([x,y],i)=>{
      const h=r.h[i];h.setAttribute('x',x-hs/2);h.setAttribute('y',y-hs/2);h.setAttribute('width',hs);h.setAttribute('height',hs)});
    const label=`W ${(x1-x0).toFixed(1)}  H ${(y1-y0).toFixed(1)}`;
    r.tagT.textContent=label;r.tagT.setAttribute('font-size',10*u);
    r.tagT.setAttribute('x',x1+8*u);r.tagT.setAttribute('y',y1+14*u);
    Object.entries({x:x1+4*u,y:y1+4*u,width:label.length*5.4*u+8*u,height:14*u}).forEach(([k,v])=>r.tag.setAttribute(k,v));
  }
}

const smooth = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function shaped(raw){                         // hold on each project, morph mid-scroll
  const i=Math.min(Math.floor(raw),COUNT-1), f=raw-i;
  const t=smooth(Math.min(1,Math.max(0,(f-.18)/.64)));
  return i+t;
}

}
function tick(){

function textHTML(list){
  const out=[];   // consecutive facts share one block (a row of columns on text-only sheets)
  list.forEach(t=>{ const last=out[out.length-1]; if(t.k==='fact'&&last&&last.k==='facts') last.list.push(t); else out.push(t.k==='fact'?{k:'facts',list:[t]}:t) });
  return out.map(t=>{
    if(t.k==='facts') return `<div class="t-facts">${t.list.map(f=>`<div class="t-fact">${f.label?`<b>${f.label}</b>`:''}<p>${f.html}</p></div>`).join('')}</div>`;
    if(t.k==='head') return `<div><div class="t-num">${t.num||''}</div><div class="t-head">${t.name}${t.sub?`<small>${t.sub}</small>`:''}</div></div>`;
    if(t.k==='sub') return `<div class="t-sub"><i>${t.num}</i>${t.name}${t.sub?`<small>${t.sub}</small>`:''}</div>`;
    if(t.k==='pull') return `<p class="t-pull">${t.html}</p>`;
    if(t.k==='en') return `<p class="t-en">${t.html}</p>`;
    if(t.k==='fact') return `<div class="t-fact">${t.label?`<b>${t.label}</b>`:''}<p>${t.html}</p></div>`;
    if(t.k==='swatches') return `<div class="t-sw">${t.list.map(s=>`<div><i style="background:${s.bg}"></i>${s.name}<span>${s.hex}</span></div>`).join('')}</div>`;
    return `<p>${t.html}</p>`;
  }).join('');
}
function cellsHTML(cells, p, eager){
  if(!cells.length) return '';
  // bounding box of the arrangement → used on phones, where the sheet loses its fixed ratio
  const x0=Math.min(...cells.map(c=>c.x)), y0=Math.min(...cells.map(c=>c.y));
  const bw=Math.max(...cells.map(c=>c.x+c.w))-x0, bh=Math.max(...cells.map(c=>c.y+c.h))-y0;
  return `<div class="s-art" style="--bw:${bw.toFixed(1)};--bh:${bh.toFixed(1)}">${cells.map((c,i)=>{
    const alt=`${p.full.join(' ')}${c.cap?' — '+c.cap:''}`.replace(/"/g,'&quot;'), ld=eager?'':' loading="lazy"';
    const media = c.video
      ? `<video src="${enc(c.video)}" poster="${enc(c.src)}" muted loop autoplay playsinline aria-label="${alt}"></video>`
      : c.crop
        ? `<div class="crop"><img src="${enc(c.src)}" alt="${alt}"${ld} style="width:100%;height:${(100/(c.crop[1]-c.crop[0])).toFixed(3)}%;top:${(-c.crop[0]/(c.crop[1]-c.crop[0])*100).toFixed(3)}%"></div>`
        : `<img src="${enc(c.src)}" alt="${alt}"${ld}>`;
    return `<figure class="cell" style="--x:${c.x};--y:${c.y};--w:${c.w};--h:${c.h};--bx:${((c.x-x0)/bw).toFixed(4)};--by:${((c.y-y0)/bh).toFixed(4)};--bww:${(c.w/bw).toFixed(4)};--bhh:${(c.h/bh).toFixed(4)}">
      ${media}<i class="hd a"></i><i class="hd b"></i><i class="hd c"></i><i class="hd d"></i>
      ${c.cap?`<figcaption><b>L${pad2(i+1)}</b><span>${c.cap}</span></figcaption>`:''}</figure>`;
  }).join('')}</div>`;
}
function detailHTML(p, idx){

  const hd = (sec,k)=>`<div class="s-hd"><span class="h-proj"><i>${pad2(idx+1)}</i>${p.full.join(' ')}</span><span class="h-sec">${sec||''}</span><span class="h-pg">${pad2(k+1)} / ${pad2(n)}</span></div>`;

    <span class="b-links"><span>A4 · ${n} pages</span><a class="b-site" href="${p.href}" target="_blank" rel="noopener">Web ↗</a><button class="b-print" data-print>Print / PDF</button><button data-next="${nx.id}">Next →</button></span>

}
/* print : load every lazy image first, then open the dialog (one sheet per A4 page) */
async function printSheets(){

    for(let i=0;i<n;i++){
      const p=document.createElement('span');
      p.className='cta-p'+(Math.random()<.5?' sq':'')+(Math.random()<.35?' yellow':'');
      p.style.left=x+'px'; p.style.top=y+'px';

      const rot=(Math.random()*180-90).toFixed(0);
      requestAnimationFrame(()=>{
        p.style.transition='transform .75s var(--ease), opacity .75s var(--ease)';
        p.style.transform=`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist-20}px) rotate(${rot}deg) scale(.25)`;
        p.style.opacity='0';
      });
      setTimeout(()=>p.remove(), 800);
    }
  }
  function wireCtaTrail(zone){

      const r=zone.getBoundingClientRect();
      ctaBurst(zone, e.clientX-r.left, e.clientY-r.top, 2);

    });
  }
  document.querySelectorAll('.cta-download,.cta-scroll').forEach(wireCtaTrail);

  /* page 1 ↔ page 2, and exit into the cover stage */

  document.getElementById('ctaDownload').addEventListener('click', e=>e.preventDefault()); /* PDF export — TODO: replace assets/portfolio.pdf */
})();

/* scroll / swipe : intro page1 → page2 → into the cover stage */

    if(!document.body.classList.contains('intro-page2')) document.body.classList.add('intro-page2');
    else closeIntro();
    cooldown();
  }
  function back(){
    if(document.body.classList.contains('intro-page2')){ document.body.classList.remove('intro-page2'); cooldown() }
  }
  intro.addEventListener('wheel', e=>{
    if(!document.body.classList.contains('intro-open')||busy||Math.abs(e.deltaY)<12) return;
    e.preventDefault();
    e.deltaY>0 ? advance() : back();
  }, {passive:false});
  let touchY=null;
  intro.addEventListener('touchstart', e=>{ touchY=e.touches[0].clientY }, {passive:true});
  intro.addEventListener('touchend', e=>{
    if(touchY==null||busy||!document.body.classList.contains('intro-open')) return;
    const dy=touchY-e.changedTouches[0].clientY; touchY=null;
    if(Math.abs(dy)<40) return;
    dy>0 ? advance() : back();
  }, {passive:true});
})();

/* cursor orb — a shape trails the pointer through the intro and blooms + spawns stamps over links and nav controls.
   lives inside #intro (not body) so it shares the intro's own stacking context — .intro paints as an opaque
   full-screen layer with its own z-index, so a body-level sibling would always render under or over it as a whole
   and could never interleave with individual links inside; nesting the orb here lets link text (z-index:2) sit
   above the orb (z-index:1) while both stay under the intro's opaque background. */
(function cursorFX(){
  if(matchMedia('(pointer:coarse)').matches || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const orb=document.createElement('div'); orb.className='cursor-orb';
  const fx=document.createElement('div'); fx.className='cursor-fx';
  document.getElementById('intro').append(orb, fx);

  let mx=innerWidth/2, my=innerHeight/2, ox=mx, oy=my, hot=false;
  addEventListener('mousemove', e=>{ mx=e.clientX; my=e.clientY });
  (function loop(){
    ox+=(mx-ox)*.2; oy+=(my-oy)*.2;
    orb.style.transform=`translate3d(${ox}px,${oy}px,0)`;
    requestAnimationFrame(loop);
  })();

  function stamp(x,y,n){
    for(let i=0;i<n;i++){
      const p=document.createElement('div');
      p.className='cfx-p'+(Math.random()<.5?' sq':'')+(Math.random()<.4?' yellow':'');
      const ang=Math.random()*Math.PI*2, dist=18+Math.random()*34;
      p.style.transform=`translate3d(${x}px,${y}px,0)`;
      fx.appendChild(p);
      requestAnimationFrame(()=>{
        p.style.transition='transform .6s var(--ease), opacity .6s var(--ease)';
        p.style.transform=`translate3d(${x+Math.cos(ang)*dist}px,${y+Math.sin(ang)*dist}px,0) scale(.3)`;
        p.style.opacity='0';
      });
      setTimeout(()=>p.remove(), 650);
    }
  }

  const HOT='.navlink,.backlink,.work-row';
  let lastStamp=0;
  document.addEventListener('mouseover', e=>{
    const t=e.target.closest(HOT); if(!t) return;
    hot=true; orb.classList.add('active');
    stamp(mx,my,4);
  });
  document.addEventListener('mouseout', e=>{
    if(!e.target.closest(HOT)) return;
    hot=false; orb.classList.remove('active');
  });
  addEventListener('mousemove', e=>{
    if(!hot) return;
    const now=performance.now();
    if(now-lastStamp<90) return;
    lastStamp=now; stamp(e.clientX,e.clientY,1);
  });
  document.addEventListener('click', e=>{
    if(e.target.closest(HOT)) stamp(e.clientX,e.clientY,12);
  });
})();

/* intro : guides on → paths draw in → guides fade */
(function intro(){
  readScroll(); cur=target; render(cur);
  route(false);
  if(openId || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.body.classList.add('show-guides');
  cover.paths.forEach(p=>{p.style.strokeDasharray='1';p.style.strokeDashoffset='1'});
  const t0=performance.now();
  (function draw(now){
    const k=Math.min(1,(now-t0)/1600), e=smooth(k);
    cover.paths.forEach(p=>p.style.strokeDashoffset=String(1-e));
    if(k<1) requestAnimationFrame(draw);
    else { cover.paths.forEach(p=>{p.style.strokeDasharray='';p.style.strokeDashoffset=''});
           setTimeout(()=>document.body.classList.remove('show-guides'),500) }
  })(t0);
})();
</script>
