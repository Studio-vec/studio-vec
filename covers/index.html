<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kim Taehui — Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Newsreader:opsz,wght@6..72,400&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   GRID SYSTEM  (reference artboard 838 × 587)
   margin  L/R 26  → 3.1vw      top/bottom 24 → 4.1vh
   7 columns × ~100, gutter 14 → 1.67vw
   ─ header labels : col 1 / col 3 / col 5
   ─ symbol        : col 1 – 4
   ─ title band    : col 5 – 7 (two horizontal guides)
   ─ footer        : col 1–2 (team) / col 3–6 (explanation)
   ========================================================= */
:root{
  --paper:#f2f4f7;
  --ink:#111;
  --sub:#8a8d94;
  --guide:#7d86f5;
  --guide-strong:#4f6ef0;
  --margin-line:#e070c0;
  --path-sel:#3b82e6;
  --yellow:#e2e400;
  --m:clamp(16px,3.1vw,48px);
  --mt:clamp(16px,4.1vh,40px);
  --g:clamp(8px,1.67vw,24px);
  --label:clamp(10px,.95vw,13px);
  --title:min(5.8vw,8.6vh);
  --ease:cubic-bezier(.77,0,.18,1);
  --stroke:var(--ink);
  --anchor:var(--ink);
}
*{box-sizing:border-box}
html{scroll-snap-type:y proximity}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Newsreader","Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
.ko{font-family:"Noto Serif KR",serif}

/* scroll track : one viewport per project */
.track > div{height:100vh;scroll-snap-align:start}

/* ================= COVER STAGE ================= */
.stage{
  position:fixed;inset:0;overflow:hidden;
  transition:transform 1s var(--ease);
  cursor:pointer;
}
body.detail-open .stage{transform:translateX(-100%)}
.frame-grid{
  position:absolute;inset:var(--mt) var(--m);
  display:grid;grid-template-columns:repeat(7,1fr);column-gap:var(--g);
  grid-template-rows:auto 1fr auto;
}

/* labels */
.lbl{font-size:var(--label);line-height:1.35;position:relative;align-self:start}
.slot{overflow:hidden;height:calc(var(--label)*1.35);position:relative}
.slot.l3{height:calc(var(--label)*1.6*3)}
.reel{will-change:transform}
.reel > div{height:calc(var(--label)*1.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.l3 .reel > div{height:calc(var(--label)*1.6*3);white-space:normal;line-height:1.6}
.top .lbl{grid-row:1}
.bot{grid-row:3;align-self:start}
.l-field{grid-column:1/2}
.l-name{grid-column:3/4}
.l-tools{grid-column:5/7}
.l-team{grid-column:1/3}
.l-desc{grid-column:3/7}
.l-count{grid-column:7/8}
.l-desc .reel > div{font-family:"Noto Serif KR",serif;font-size:calc(var(--label)*.96)}
.l-name .reel > div{font-family:"Noto Serif KR","Newsreader",serif}

/* symbol */
.sym-wrap{grid-column:1/5;grid-row:2;position:relative;align-self:stretch;min-height:0}
.sym-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sym path.shape{fill:none;stroke:var(--stroke);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:miter;transition:stroke .3s}
.sym rect.anc{fill:var(--anchor);transition:fill .3s}
.sym rect.sel{fill:var(--yellow);stroke:var(--anchor);stroke-width:1;vector-effect:non-scaling-stroke}
.sym .bbox rect.box{fill:none;stroke:var(--guide-strong);stroke-width:1;vector-effect:non-scaling-stroke}
.sym .bbox rect.h{fill:#fff;stroke:var(--guide-strong);stroke-width:1;vector-effect:non-scaling-stroke}
.sym .bbox text{font:10px "Newsreader",serif;fill:#fff}
.sym .bbox rect.tag{fill:var(--guide-strong)}

/* title band */
.title-band{
  grid-column:5/8;grid-row:2;align-self:center;
  height:calc(var(--title)*2.25);overflow:hidden;position:relative;
  margin-right:calc(var(--m)*-1);padding-right:var(--m);
}
.title-band .reel > div{
  height:calc(var(--title)*2.25);display:flex;flex-direction:column;justify-content:center;
  font-family:"Instrument Serif",serif;font-weight:400;font-size:var(--title);line-height:1.04;letter-spacing:-.01em;
}
.title-band .reel span{display:block;white-space:nowrap}

/* left-middle : back to the first intro page (shown on every project cover) */
.stageBack{position:absolute;left:calc(var(--m) - 16px);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;background:none;border:0;padding:16px;cursor:pointer;font-family:"Newsreader","Noto Serif KR",serif;font-size:var(--label);letter-spacing:.06em;color:var(--sub);z-index:5}
.stageBack:hover{color:var(--ink)}
.stageBack svg{width:14px;height:14px;display:block;transition:transform .3s var(--ease)}
.stageBack:hover svg{transform:translateX(-3px)}

/* corner markers (selection-box icons) */
.corner{position:absolute;right:calc(var(--m) - 12px);width:22px;height:22px;cursor:pointer;background:none;border:0;padding:0}
.corner.tr{top:calc(var(--mt) - 12px)}
.corner.br{bottom:calc(var(--mt) - 12px)}
.corner svg{width:22px;height:22px;display:block}

/* ================= GUIDES (Ctrl+; / G) ================= */
.guides{position:absolute;inset:var(--mt) var(--m);pointer-events:none;opacity:0;transition:opacity .5s}
.guides .cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);column-gap:var(--g)}
.guides .cols i{border-left:1px solid var(--guide);border-right:1px solid var(--guide)}
.guides .page{position:absolute;inset:0;border:1px solid var(--guide);border-top-color:var(--margin-line)}
.guides .page::before{content:"";position:absolute;top:-1px;left:calc(var(--m)*-1);right:calc(var(--m)*-1);border-top:1px solid var(--margin-line)}
body.show-guides .guides{opacity:1}
.fr{outline:1px solid transparent;outline-offset:0;transition:outline-color .5s}
body.show-guides .fr{outline-color:var(--guide)}
body.show-guides{--stroke:var(--path-sel);--anchor:#10205a}

/* cursor tag (smart-guide label) */
.ctag{
  position:fixed;left:0;top:0;pointer-events:none;z-index:40;
  font:11px/1 "Newsreader",serif;letter-spacing:.02em;color:#fff;background:var(--guide-strong);
  padding:4px 6px 3px;opacity:0;transition:opacity .2s;white-space:nowrap
}
.ctag.on{opacity:1}

/* ================= DETAIL PAGE ================= */
.detail{
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--paper);
  transform:translateX(100%);transition:transform 1s var(--ease);z-index:20;
  border-left:1px solid var(--guide);
  overscroll-behavior:contain;
}
body.detail-open .detail{transform:translateX(0)}
.detail.no-anim{transition:none}
.detail.swap-out{transform:translateX(-100%)!important}
.detail.swap-in{transform:translateX(100%)!important;transition:none}
/* two panes on the 7-col grid : info (col 1–2, sticky) | gallery (col 3–7, scrolls) */
.d-wrap{display:grid;grid-template-columns:repeat(7,1fr);column-gap:var(--g);padding:0 var(--m);align-items:start}
.d-aside{
  grid-column:1/3;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:none;
  display:flex;flex-direction:column;padding:var(--mt) calc(var(--g)*.5) var(--mt) 0;
  border-right:1px solid rgba(125,134,245,.45);margin-right:calc(var(--g)*-.5);
  font-size:var(--label);line-height:1.4
}
.d-aside::-webkit-scrollbar{display:none}
.d-top{display:flex;justify-content:space-between}
.d-top button{all:unset;cursor:pointer}
.d-top button:hover,.d-nextbtn:hover{color:var(--guide-strong)}
.dsym{position:relative;height:clamp(130px,25vh,250px);margin:3vh 0 2.4vh}
.dsym svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dtitle{margin:0;font-weight:400;font-family:"Instrument Serif",serif;font-size:clamp(28px,3.2vw,54px);line-height:1.04;letter-spacing:-.01em}
.dtitle span{display:block;white-space:nowrap}
.d-ko{font-family:"Noto Serif KR",serif;color:var(--sub);margin-top:.9em}
.d-desc{font-family:"Noto Serif KR",serif;font-size:calc(var(--label)*1.08);line-height:1.75;margin:1.6em 0 2em}
.d-info{display:grid;grid-template-columns:minmax(64px,.8fr) 2fr}
.d-info .k,.d-info .v{padding:8px 0;border-top:1px solid rgba(17,17,17,.12)}
.d-info .k{color:var(--sub);padding-right:10px}
.d-info .v{font-family:"Noto Serif KR",serif;line-height:1.65}
.d-nextbtn{all:unset;cursor:pointer;margin-top:auto;padding-top:3vh;display:block}
.d-nextbtn b{display:block;margin-top:.4em;font-weight:400;font-family:"Instrument Serif",serif;font-size:calc(var(--label)*1.9);line-height:1.1}

/* gallery : tight masonry */
.d-gallery{grid-column:3/8;padding:var(--mt) 0 var(--mt);display:flex;flex-direction:column}
.fig{margin:0;position:relative;background:#e6e8ec}
.fig.inset{width:88%;align-self:center}
.fig.board{background:#fff;padding:clamp(20px,7%,64px)}
.fig.board img{width:100%;height:auto;max-height:46vh;object-fit:contain}
.frow{display:flex}
.frow .cell{min-width:0}
.frow .cell img{width:100%;height:auto;display:block}
.frow .cell.board{background:#fff;padding:clamp(12px,5%,44px);display:flex;align-items:center}
.frow .cell.board img{max-height:34vh;object-fit:contain}
.fig.txt{background:#fff;padding:clamp(28px,7vw,72px) clamp(20px,9%,80px);text-align:center;font-family:"Noto Serif KR",serif;font-size:calc(var(--label)*1.08);line-height:1.8}
.fig.txt p{margin:0 auto;max-width:60ch}
.fig.txt p+p{margin-top:.7em}
.fig.txt p.en{color:var(--sub);font-size:calc(var(--label)*.96)}
.fig.txt a{text-decoration:underline;text-underline-offset:3px}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(6px,1.4vw,20px)}
.d-empty{font-family:"Noto Serif KR",serif;font-size:var(--label);color:var(--sub);padding:var(--mt) 0}
.strip img{image-rendering:pixelated}
.fig img{display:block;width:100%;height:auto}
.fig figcaption{
  position:absolute;left:0;top:0;z-index:2;opacity:0;transition:opacity .2s;
  font:11px/1 "Newsreader",serif;color:#fff;background:var(--guide-strong);padding:4px 6px 3px;display:flex;gap:.8em
}
.fig::after{content:"";position:absolute;inset:0;outline:1px solid var(--guide-strong);outline-offset:-1px;opacity:0;transition:opacity .2s;pointer-events:none}
.fig .hd{position:absolute;width:7px;height:7px;background:#fff;border:1px solid var(--guide-strong);opacity:0;transition:opacity .2s;z-index:1}
.fig .hd.a{left:-3px;top:-3px}.fig .hd.b{right:-3px;top:-3px}.fig .hd.c{left:-3px;bottom:-3px}.fig .hd.d{right:-3px;bottom:-3px}
.fig:hover::after,.fig:hover .hd,.fig:hover figcaption{opacity:1}

/* ================= INTRO — 2 pages shown before the cover stage ================= */
body.intro-open{overflow:hidden}
.intro{position:fixed;inset:0;z-index:30;overflow:hidden;background:var(--paper);transition:transform 1s var(--ease)}
body:not(.intro-open) .intro{transform:translateX(-100%);pointer-events:none}
.intro-track{position:absolute;inset:0;width:200%;display:flex;transition:transform 1s var(--ease)}
body.intro-page2 .intro-track{transform:translateX(-50%)}
.intro-page{width:50%;height:100%;position:relative;flex:none}
.intro-grid{position:absolute;inset:var(--mt) var(--m);display:grid;grid-template-columns:repeat(7,1fr);column-gap:var(--g);grid-template-rows:auto 1fr auto;height:calc(100% - var(--mt)*2)}
.intro .lbl{font-size:var(--label);line-height:1.35}
.i-field{grid-column:1/3;grid-row:1}
.i-name{grid-column:3/5;grid-row:1;text-align:center}
.i-tools{grid-column:5/8;grid-row:1;text-align:right}
.i-edu{grid-column:1/3;grid-row:3;align-self:start}
.i-awd{grid-column:3/7;grid-row:3;align-self:start;font-family:"Noto Serif KR",serif;font-size:calc(var(--label)*.96);line-height:1.55}
.i-count{grid-column:7/8;grid-row:3;align-self:start;text-align:right;justify-self:end}
.i-count-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:var(--label);color:var(--ink)}
.i-count-btn svg{width:11px;height:11px;transition:transform .3s var(--ease)}
.i-count-btn:hover svg{transform:translateY(2px)}
.i-title{grid-column:5/8;grid-row:2;align-self:center;position:relative}
.i-title h1{margin:0;font-family:"Instrument Serif",serif;font-weight:400;font-size:var(--title);line-height:1.02;letter-spacing:-.01em}
.i-title h1 span{display:block;white-space:nowrap}
.i-title h1 span.hl{background-image:linear-gradient(var(--yellow),var(--yellow));background-repeat:no-repeat;background-size:100% .26em;background-position:0 92%}
.i-symzone{grid-column:1/5;grid-row:2;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:calc(var(--g)*.7)}
.i-padcap{display:flex;justify-content:space-between;width:100%;max-width:560px}

.drawpad{position:relative;width:min(44vw,560px);aspect-ratio:10/7;background:var(--yellow)}
.drawpad .dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,var(--ink) 1px,transparent 1.4px);background-size:10% 14.29%;background-position:5% 7.14%;opacity:.3}
.dp-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(7,1fr)}
.dp-cell{border:0;background:transparent;padding:0;cursor:pointer;position:relative}
.dp-cell::after{content:"";position:absolute;left:50%;top:50%;width:56%;height:56%;background:var(--ink);opacity:0;border-radius:50%;transform:translate(-50%,-50%) scale(.6);transition:opacity .12s,transform .12s}
.dp-cell[data-shape]::after{opacity:1;transform:translate(-50%,-50%) scale(1)}
.dp-cell[data-shape="square"]::after{border-radius:0}
.drawpad[data-tool="square"] .dp-cell:not([data-shape]):hover::after{border-radius:0}
.dp-cell:not([data-shape]):hover::after{opacity:.25;transform:translate(-50%,-50%) scale(.7)}
.dp-toolbar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;z-index:2}
.dp-tool{all:unset;cursor:pointer;width:26px;height:26px;box-sizing:border-box;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink)}
.dp-tool.active{background:var(--ink);color:var(--yellow)}
.dp-tool svg{width:12px;height:12px;display:block}
.dp-clear{all:unset;cursor:pointer;position:absolute;right:10px;bottom:10px;z-index:2;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.dp-clear:hover{opacity:.6}

.intro .navlink{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-family:"Instrument Serif",serif;font-size:calc(var(--label)*1.9);color:var(--ink)}
.intro .navlink svg{width:15px;height:15px;transition:transform .3s var(--ease)}
.intro .navlink.down:hover svg{transform:translateY(3px)}
.intro .navlink.right:hover svg{transform:translateX(3px)}
.intro .backlink{all:unset;cursor:pointer;font-size:var(--label);letter-spacing:.06em;color:var(--sub)}
.intro .backlink:hover{color:var(--ink)}
.intro .foot{position:absolute;left:var(--m);right:var(--m);bottom:var(--mt);display:flex;justify-content:space-between;align-items:center}
.intro .dlmini{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:var(--label);color:var(--sub)}
.intro .dlmini:hover{color:var(--ink)}
.intro .dlmini svg{width:13px;height:13px}

.works-list{grid-column:1/8;grid-row:2;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.work-row{display:grid;grid-template-columns:44px 1.5fr 190px 2fr;column-gap:20px;align-items:baseline;padding:calc(var(--mt)*.32) 0;border-top:1px solid rgba(17,17,17,.12);text-decoration:none;color:var(--ink);cursor:pointer;background:none}
.work-row:hover{color:var(--guide-strong)}
.work-row .idx{font-family:"Newsreader",serif;font-style:italic;font-size:var(--label);color:var(--sub)}
.work-row:hover .idx{color:var(--guide-strong)}
.work-row .nm b{font-family:"Instrument Serif",serif;font-weight:400;font-size:calc(var(--label)*1.9)}
.work-row .nm i{font-family:"Noto Serif KR",serif;font-style:normal;font-size:calc(var(--label)*.9);color:var(--sub);margin-left:10px}
.work-row .fd{font-family:"Noto Serif KR",serif;font-size:calc(var(--label)*.92);color:var(--sub)}
.work-row .ds{font-family:"Noto Serif KR",serif;font-size:calc(var(--label)*.96);line-height:1.5}

@media (max-width:760px){
  .i-symzone{grid-column:1/8;grid-row:2}
  .i-title{grid-column:1/8;grid-row:3}
  .i-edu{grid-row:4;grid-column:1/4}
  .i-awd{grid-row:4;grid-column:4/8}
  .i-count{grid-row:5;grid-column:1/8;text-align:left;justify-self:start;margin-top:10px}
  .intro-grid{grid-template-rows:auto 1fr auto auto auto}
  .drawpad{width:80vw}
  .work-row{grid-template-columns:32px 1fr;row-gap:4px}
  .work-row .fd,.work-row .ds{grid-column:2/3}
}

/* ================= SMALL SCREENS ================= */
@media (max-width:760px){
  :root{--title:11vw;--label:11px}
  .l-name{grid-column:4/8}
  .l-tools{display:none}
  .l-team{grid-column:1/4}
  .l-desc{grid-column:4/8}
  .l-count{display:none}
  .slot.l3,.slot.l3 .reel > div{height:calc(var(--label)*1.6*5)}
  .sym-wrap{grid-column:1/8;height:38vh;align-self:center}
  .frame-grid{grid-template-rows:auto 1fr auto auto 1fr auto}
  .top .lbl{grid-row:1}
  .sym-wrap{grid-row:2}
  .title-band{grid-column:1/8;grid-row:3;margin-right:0;padding-right:0}
  .bot{grid-row:6}
}
@media (max-width:900px){
  .d-aside{grid-column:1/8;position:static;height:auto;overflow:visible;border-right:0;margin-right:0;padding-right:0}
  .d-gallery{grid-column:1/8;columns:1;padding-top:0}
  .d-nextbtn{margin-top:4vh}
  .fig{background:none}
  .fig figcaption{opacity:1;position:static;background:none;color:var(--sub);padding:6px 0 0}
}
@media (prefers-reduced-motion:reduce){
  .stage,.detail{transition:none}
}
</style>
</head>
<body class="intro-open">

<div class="track" id="track"></div>

<!-- ============ INTRO — shown before the project cover stage ============ -->
<div class="intro" id="intro">
  <div class="intro-track" id="introTrack">

    <section class="intro-page" id="introPage1">
      <div class="intro-grid">
        <span class="lbl ko i-field">Portfolio</span>
        <span class="lbl ko i-name">김태희</span>
        <span class="lbl i-tools">Illustrator · Photoshop · Figma · After Effects</span>

        <div class="i-symzone">
          <div class="drawpad" id="drawpad" data-tool="circle">
            <div class="dots"></div>
            <div class="dp-grid" id="dpGrid"></div>
            <div class="dp-toolbar">
              <button class="dp-tool active" data-tool="circle" aria-label="Circle" title="Circle"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/></svg></button>
              <button class="dp-tool" data-tool="square" aria-label="Square" title="Square"><svg viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" fill="currentColor"/></svg></button>
            </div>
            <button class="dp-clear" id="dpClear">Clear</button>
          </div>
          <div class="i-padcap">
            <span class="lbl ko">그려보세요 — 도형으로 남기는 자국</span>
            <span class="lbl">Draw</span>
          </div>
        </div>

        <div class="i-title"><h1><span>KIM</span><span class="hl">TAEHUI</span></h1></div>

        <span class="lbl ko i-edu">Sejong University<br>디자인이노베이션학과</span>
        <span class="lbl ko i-awd">Asia Design Prize · Graphis New Talent Award<br>제59회 대한민국 디자인 전람회 입선 외 수상 6건</span>
        <button class="lbl i-count i-count-btn" id="introToWorks"><span id="introCount">Works</span>
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 2.5V16" stroke="currentColor" stroke-width="1"/><path d="M4 10.5L10 16.5L16 10.5" stroke="currentColor" stroke-width="1"/></svg>
        </button>
      </div>
    </section>

    <section class="intro-page" id="introPage2">
      <div class="intro-grid">
        <span class="lbl ko i-field">Selected Works</span>
        <span class="lbl i-tools" id="introWorksHead" style="grid-column:5/8">Projects · 2022 — 2026</span>
        <div class="works-list" id="worksList"></div>
      </div>
      <div class="foot">
        <button class="backlink" id="introBack">← Intro</button>
        <a class="dlmini" href="#" id="introDl" title="PDF 다운로드 — 준비중">Portfolio PDF
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 2.5V13" stroke="currentColor" stroke-width="1"/><path d="M5.2 9L10 13.5L14.8 9" stroke="currentColor" stroke-width="1"/><path d="M3 17H17" stroke="currentColor" stroke-width="1"/></svg>

/* ---------- sampling & normalisation ---------- */
const N = 160;
const sampler = document.getElementById('sampler');
/* corner-preserving resample: every node (f = node positions as fraction of length) is hit exactly,
   remaining points are spread along each segment in proportion to its length */
function along(L, f, M, closed){
  const stops=[0,...(f||[]),1], segs=stops.length-1, slots=closed?M:M-1;
  if(segs>slots) return Array.from({length:M},(_,i)=>L*i/(closed?M:M-1));
  const extra=slots-segs, lens=stops.slice(1).map((v,i)=>v-stops[i]);
  const raw=lens.map(l=>l*extra), cnt=raw.map(Math.floor);
  let left=extra-cnt.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-cnt[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([,i])=>cnt[i]++);
  const out=[];
  stops.slice(0,-1).forEach((st,i)=>{const k=cnt[i]+1;for(let j=0;j<k;j++) out.push(L*(st+lens[i]*j/k))});
  if(!closed) out.push(L);
  return out;
}
function sample(d, open, f){
  sampler.setAttribute('d', d);
  const L = sampler.getTotalLength(), pt=l=>{const p=sampler.getPointAtLength(Math.min(l,L));return [p.x,p.y]};
  if(open){
    const fwd=along(L,f,N/2,false).map(pt);
    return fwd.concat(fwd.slice().reverse().map(p=>p.slice()));   // ping-pong → closed loop
  }
  const pts=along(L,f,N,true).map(pt);
  let a=0;for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N];a+=p[0]*q[1]-q[0]*p[1]}
  if(a<0) pts.reverse();                                          // clockwise
  let k=0;for(let i=1;i<N;i++){if(pts[i][1]<pts[k][1]-.01||(Math.abs(pts[i][1]-pts[k][1])<.01&&pts[i][0]<pts[k][0]))k=i}
  return pts.slice(k).concat(pts.slice(0,k));                      // start at top-left
}
const MAXS = Math.max(...Object.values(SYMBOLS).map(s=>s.shapes.length));
const MAXA = Math.max(...Object.values(SYMBOLS).map(s=>s.anchors.length));
const MAXSEL = Math.max(...Object.values(SYMBOLS).map(s=>s.sel.length));
const PREP = {};
for(const [id,s] of Object.entries(SYMBOLS)){
  const shapes = s.shapes.map(sh=>sample(sh.d, sh.open, sh.f));
  let cx=0,cy=0,n=0;shapes.forEach(ps=>ps.forEach(p=>{cx+=p[0];cy+=p[1];n++}));cx/=n;cy/=n;
  while(shapes.length<MAXS) shapes.push(Array.from({length:N},()=>[cx,cy]));   // collapsed slot
  const pad=(arr,m)=>Array.from({length:m},(_,i)=>arr[i%arr.length]);
  PREP[id]={shapes, anchors:pad(s.anchors,MAXA), sel:pad(s.sel,MAXSEL),
    exact:Array.from({length:MAXS},(_,i)=>s.shapes[i]?s.shapes[i].d:''), crisp:!!s.crisp};
}

/* ---------- SVG renderer ---------- */
const NS='http://www.w3.org/2000/svg';
function mkSym(svg, withBox){
  const el=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
  const r={svg,paths:[],anc:[],sel:[]};
  for(let i=0;i<MAXS;i++) r.paths.push(el('path',{class:'shape',pathLength:1}));
  for(let i=0;i<MAXA;i++) r.anc.push(el('rect',{class:'anc'}));
  for(let i=0;i<MAXSEL;i++) r.sel.push(el('rect',{class:'sel'}));
  if(withBox){
    const g=el('g',{class:'bbox'});r.box=g;
    r.boxRect=el('rect',{class:'box'},g);
    r.h=[...Array(8)].map(()=>el('rect',{class:'h'},g));
    r.tag=el('rect',{class:'tag'},g);r.tagT=el('text',{},g);
  }
  return r;
}
function unit(svg){ const w=svg.getBoundingClientRect().width||440, h=svg.getBoundingClientRect().height||300; return Math.max(440/w,300/h) }
const lerp=(a,b,t)=>a+(b-a)*t;
function drawSym(r, idA, idB, t){
  const A=PREP[idA],B=PREP[idB||idA],u=unit(r.svg);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const rest = idA===idB||t<.0005||t>.9995, R = t>.5?B:A;
  r.svg.setAttribute('shape-rendering', rest&&R.crisp?'crispEdges':'geometricPrecision');
  for(let s=0;s<MAXS;s++){
    if(rest){ r.paths[s].setAttribute('d',R.exact[s]); continue }      // at rest: original vector, no resampling
    const pa=A.shapes[s],pb=B.shapes[s];let d='';
    for(let i=0;i<N;i++){
      const x=lerp(pa[i][0],pb[i][0],t),y=lerp(pa[i][1],pb[i][1],t);
      d+=(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2);
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
    }
    r.paths[s].setAttribute('d',d+'Z');
  }
  const put=(list,a,b,size)=>list.forEach((rc,i)=>{
    const x=lerp(a[i][0],b[i][0],t),y=lerp(a[i][1],b[i][1],t);
    rc.setAttribute('x',x-size/2);rc.setAttribute('y',y-size/2);rc.setAttribute('width',size);rc.setAttribute('height',size);
  });
  put(r.anc,A.anchors,B.anchors,4*u);
  put(r.sel,A.sel,B.sel,10*u);
  if(r.box){
    const vis=Math.sin(Math.PI*t);r.box.style.opacity=vis>.02?Math.min(1,vis*1.6):0;
    const pad=10*u;x0-=pad;y0-=pad;x1+=pad;y1+=pad;
    Object.entries({x:x0,y:y0,width:x1-x0,height:y1-y0}).forEach(([k,v])=>r.boxRect.setAttribute(k,v));
    const hs=6*u,mx=(x0+x1)/2,my=(y0+y1)/2;
    [[x0,y0],[mx,y0],[x1,y0],[x1,my],[x1,y1],[mx,y1],[x0,y1],[x0,my]].forEach(([x,y],i)=>{
      const h=r.h[i];h.setAttribute('x',x-hs/2);h.setAttribute('y',y-hs/2);h.setAttribute('width',hs);h.setAttribute('height',hs)});
    const label=`W ${(x1-x0).toFixed(1)}  H ${(y1-y0).toFixed(1)}`;
    r.tagT.textContent=label;r.tagT.setAttribute('font-size',10*u);
    r.tagT.setAttribute('x',x1+8*u);r.tagT.setAttribute('y',y1+14*u);
    Object.entries({x:x1+4*u,y:y1+4*u,width:label.length*5.4*u+8*u,height:14*u}).forEach(([k,v])=>r.tag.setAttribute(k,v));
  }
}

/* =========================================================
   COVER — scroll-driven morph + rolling labels
   ========================================================= */
PROJECTS.forEach(p=>p.images=GALLERY[p.id]||[]);
const COUNT = PROJECTS.length;
const pad2 = n => String(n).padStart(2,'0');
document.getElementById('track').innerHTML = PROJECTS.map(()=>'<div></div>').join('');
const reels = [...document.querySelectorAll('.stage .reel')];
reels.forEach(reel=>{
  const k=reel.dataset.key;
  reel.innerHTML = PROJECTS.map((p,i)=>{
    if(k==='title') return `<div>${p.title.map(t=>`<span>${t}</span>`).join('')}</div>`;
    if(k==='count') return `<div>${pad2(i+1)} / ${pad2(COUNT)}</div>`;
    return `<div>${p[k]}</div>`;
  }).join('');
});
const cover = mkSym(document.getElementById('sym'), true);

const smooth = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function shaped(raw){                         // hold on each project, morph mid-scroll
  const i=Math.min(Math.floor(raw),COUNT-1), f=raw-i;
  const t=smooth(Math.min(1,Math.max(0,(f-.18)/.64)));
  return i+t;
}
let cur=0, target=0, running=false;
function readScroll(){ if(innerHeight) target = shaped(Math.min(COUNT-1, Math.max(0, scrollY/innerHeight))) }
function render(p){
  if(!isFinite(p)) p=0;
  const i=Math.min(Math.floor(p),COUNT-1), t=p-i, j=Math.min(i+1,COUNT-1);
  drawSym(cover, PROJECTS[i].id, PROJECTS[j].id, i===j?0:t);
  reels.forEach(r=>r.style.transform=`translateY(${-p*100/COUNT}%)`);
}
function tick(){
  cur += (target-cur)*.14;
  if(Math.abs(target-cur)<.0004) cur=target;
  render(cur);
  running = cur!==target;
  if(running) requestAnimationFrame(tick);
}
function kick(){ readScroll(); if(!running){running=true;requestAnimationFrame(tick)} }
addEventListener('scroll', kick, {passive:true});
addEventListener('resize', ()=>{ render(cur); if(openId) drawDetailSyms(); });

/* guides */
const toggleGuides = ()=>document.body.classList.toggle('show-guides');
document.getElementById('guideBtn').addEventListener('click', e=>{e.stopPropagation();toggleGuides()});
document.getElementById('nextBtn').addEventListener('click', e=>{

  const k=(Math.round(cur)+1)%COUNT; scrollTo({top:k*innerHeight,behavior:'smooth'});

document.getElementById('stageBackBtn').addEventListener('click', e=>{

/* =========================================================
   DETAIL PAGE — slides in from the right
   ========================================================= */
const detail=document.getElementById('detail');
let openId=null, dSyms=[];
const enc = p => encodeURI(p).replace(/#/g,'%23');

function detailHTML(p, idx){
  const nx = PROJECTS[(idx+1)%COUNT];
  const rows=[['Field',p.field],['Tools',p.tools],['Team',p.team],['Role',p.role],['Overview',p.overview]];
  return `
  <div class="d-wrap">
    <aside class="d-aside">
      <div class="d-top"><button data-back>← Index</button><span>${pad2(idx+1)} / ${pad2(COUNT)}</span></div>
      <div class="dsym"><svg class="sym" viewBox="0 0 440 300" data-sym="${p.id}"></svg></div>
      <h1 class="dtitle">${p.title.map(t=>`<span>${t}</span>`).join('')}</h1>
      <div class="d-ko">${p.nameKo}</div>
      <p class="d-desc">${p.desc}</p>
      <div class="d-info">${rows.map(([k,v])=>`<div class="k">${k}</div><div class="v">${v}</div>`).join('')}</div>
      <button class="d-nextbtn" data-next="${nx.id}"><span>Next →</span><b>${nx.title.join(' ')}</b></button>
    </aside>
    <section class="d-gallery">
      ${!p.images.length ? `<div class="d-empty">이미지 준비중 — 자료가 추가되면 여기에 표시됩니다.</div>` : p.images.map((it,i)=>{
        const f=it.f||'';
        return `
        <figure class="fig${f.includes('b')?' board':''}${f.includes('i')?' inset':''}${it.text?' txt':''}">
          ${it.text
            ? (it.text.html ? `<p>${it.text.html}</p>` : `<p>${it.text.kr}</p><p class="en">${it.text.en}</p>`)
            : it.row
              ? `<div class="frow">${it.row.map(c=>`<div class="cell${c.b?' board':''}" style="flex:${c.r} 1 0"><img src="${enc(c.src)}" alt="${p.title.join(' ')} — ${it.cap}" loading="lazy"></div>`).join('')}</div>`
              : Array.isArray(it.src)
                ? `<div class="strip">${it.src.map(x=>`<img src="${enc(x)}" alt="" loading="lazy">`).join('')}</div>`
                : `<img src="${enc(it.src)}" alt="${p.title.join(' ')} — ${it.cap}" ${i>1?'loading="lazy"':''}>`}
          <i class="hd a"></i><i class="hd b"></i><i class="hd c"></i><i class="hd d"></i>
          <figcaption><b>L${pad2(i+1)}</b><span>${it.cap}</span></figcaption>
        </figure>`}).join('')}
    </section>
  </div>`;
}
function drawDetailSyms(){ dSyms.forEach(([r,id])=>drawSym(r,id,id,0)) }
function fillDetail(id){
  const idx=PROJECTS.findIndex(p=>p.id===id), p=PROJECTS[idx];
  detail.innerHTML=detailHTML(p,idx);
  detail.scrollTop=0;
  dSyms=[...detail.querySelectorAll('svg[data-sym]')].map(s=>[mkSym(s,false),s.dataset.sym]);
  requestAnimationFrame(drawDetailSyms);
  document.title=`${p.title.join(' ')} — Kim Taehui`;
  // keep the cover in sync so "Index" returns to this project
  document.documentElement.style.scrollSnapType='none';
  scrollTo(0, idx*innerHeight); target=cur=idx; render(cur);
  requestAnimationFrame(()=>document.documentElement.style.scrollSnapType='');
}
detail.addEventListener('click', e=>{
  if(e.target.closest('[data-back]')) return go(null);
  const n=e.target.closest('[data-next]'); if(n) go(n.dataset.next);
});

function openDetail(id, animate=true){
  ctag.classList.remove('on');
  if(openId && openId!==id && animate){                 // detail → next detail: push left, enter from right
    detail.classList.add('swap-out');
    setTimeout(()=>{
      detail.classList.remove('swap-out'); detail.classList.add('swap-in');
      fillDetail(id); detail.offsetWidth;
      detail.classList.remove('swap-in');
    }, 700);
  } else {
    if(!animate) detail.classList.add('no-anim');
    fillDetail(id);
    document.body.classList.add('detail-open','locked');
    if(!animate) requestAnimationFrame(()=>detail.classList.remove('no-anim'));
  }
  openId=id;
}
function closeDetail(){
  document.body.classList.remove('detail-open','locked');
  document.title='Kim Taehui — Works';
  openId=null;
}

/* hash routing  (#/voyeur …) */
function go(id){
  if(id) location.hash='/'+id;
  else { history.pushState(null,'',location.pathname+location.search); route() }
}
function route(animate=true){
  const id=location.hash.replace(/^#\/?/,'');
  if(id && PROJECTS.some(p=>p.id===id)) openDetail(id, animate);
  else if(openId) closeDetail();
}
addEventListener('hashchange', ()=>route(true));

/* keyboard */
addEventListener('keydown', e=>{
  if(e.key==='g'||e.key==='G'||(e.key===';'&&(e.ctrlKey||e.metaKey))){e.preventDefault();toggleGuides()}
  if(e.key==='Escape'&&openId) go(null);
  if(e.key==='Enter'&&!openId) go(PROJECTS[Math.round(cur)].id);
});

if(location.hash.replace(/^#\/?/,'')) document.body.classList.remove('intro-open');
function closeIntro(){ document.body.classList.remove('intro-open') }
(function initIntro(){
  document.getElementById('introCount').textContent = pad2(COUNT)+' Works';
  document.getElementById('introWorksHead').textContent = pad2(COUNT)+' Projects · 2022 — 2026';
  const worksList = document.getElementById('worksList');
  worksList.innerHTML = PROJECTS.map((p,i)=>`
    <a class="work-row" data-goto="${p.id}">
      <span class="idx">${pad2(i+1)}</span>
      <span class="nm"><b>${p.title.join(' ')}</b><i>${p.nameKo}</i></span>
      <span class="fd">${p.field}</span>
      <span class="ds">${p.desc}</span>
    </a>`).join('');
  worksList.addEventListener('click', e=>{
    const row=e.target.closest('[data-goto]'); if(!row) return;
    closeIntro(); go(row.dataset.goto);
  });

  /* draw pad — click a grid cell to stamp the current tool, click again to erase it */
  const DP_COLS=10, DP_ROWS=7;
  const pad=document.getElementById('drawpad'), grid=document.getElementById('dpGrid');
  for(let i=0;i<DP_COLS*DP_ROWS;i++){
    const cell=document.createElement('button');
    cell.type='button'; cell.className='dp-cell'; cell.setAttribute('aria-label','drawing cell');
    grid.appendChild(cell);
  }
  grid.addEventListener('click', e=>{
    const cell=e.target.closest('.dp-cell'); if(!cell) return;
    if(cell.hasAttribute('data-shape')) cell.removeAttribute('data-shape');
    else cell.setAttribute('data-shape', pad.dataset.tool);
  });
  pad.querySelectorAll('.dp-tool').forEach(btn=>btn.addEventListener('click', ()=>{
    pad.dataset.tool=btn.dataset.tool;
    pad.querySelectorAll('.dp-tool').forEach(b=>b.classList.toggle('active', b===btn));
  }));
  document.getElementById('dpClear').addEventListener('click', ()=>{
    grid.querySelectorAll('[data-shape]').forEach(c=>c.removeAttribute('data-shape'));
  });

  /* page 1 ↔ page 2, and exit into the cover stage */
  document.getElementById('introToWorks').addEventListener('click', ()=>document.body.classList.add('intro-page2'));
  document.getElementById('introBack').addEventListener('click', ()=>document.body.classList.remove('intro-page2'));
  document.getElementById('introEnter').addEventListener('click', closeIntro);
  document.getElementById('introDl').addEventListener('click', e=>e.preventDefault()); /* PDF export — TODO */
})();

/* scroll / swipe : intro page1 → page2 → into the cover stage */
(function introScroll(){
  const intro=document.getElementById('intro');
  let busy=false;
  const cooldown=()=>{busy=true; setTimeout(()=>busy=false, 900)};
  function advance(){
    if(!document.body.classList.contains('intro-page2')) document.body.classList.add('intro-page2');
    else closeIntro();
    cooldown();
  }
  function back(){
    if(document.body.classList.contains('intro-page2')){ document.body.classList.remove('intro-page2'); cooldown() }
  }
  intro.addEventListener('wheel', e=>{
    if(!document.body.classList.contains('intro-open')||busy||Math.abs(e.deltaY)<12) return;
    e.preventDefault();
    e.deltaY>0 ? advance() : back();
  }, {passive:false});
  let touchY=null;
  intro.addEventListener('touchstart', e=>{ touchY=e.touches[0].clientY }, {passive:true});
  intro.addEventListener('touchend', e=>{
    if(touchY==null||busy||!document.body.classList.contains('intro-open')) return;
    const dy=touchY-e.changedTouches[0].clientY; touchY=null;
    if(Math.abs(dy)<40) return;
    dy>0 ? advance() : back();
  }, {passive:true});
})();

/* intro : guides on → paths draw in → guides fade */
(function intro(){
  readScroll(); cur=target; render(cur);
  route(false);
  if(openId || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.body.classList.add('show-guides');
  cover.paths.forEach(p=>{p.style.strokeDasharray='1';p.style.strokeDashoffset='1'});
  const t0=performance.now();
  (function draw(now){
    const k=Math.min(1,(now-t0)/1600), e=smooth(k);
    cover.paths.forEach(p=>p.style.strokeDashoffset=String(1-e));
    if(k<1) requestAnimationFrame(draw);
    else { cover.paths.forEach(p=>{p.style.strokeDasharray='';p.style.strokeDashoffset=''});
           setTimeout(()=>document.body.classList.remove('show-guides'),500) }
  })(t0);
})();
</script>
</body>
