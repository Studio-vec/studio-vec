  <g id="_레이어_1" data-name="레이어 1">
    <text class="cls-4" transform="translate(256.45 346.57)"><tspan class="cls-1"><tspan x="0" y="0">Bright light </tspan></tspan><tspan class="cls-9"><tspan x="7.88" y="16.8">Beginner</tspan></tspan><tspan class="cls-9"><tspan x="-29.14" y="50.4">the pupil contracts—</tspan></tspan><tspan class="cls-9"><tspan x="-54.07" y="67.2">representing the controlled,</tspan></tspan><tspan class="cls-9"><tspan x="-68.56" y="84">foundational stage of a beginner.</tspan></tspan></text>
    <text class="cls-4" transform="translate(510.97 346.57)"><tspan class="cls-1"><tspan x="0" y="0">Mid light </tspan></tspan><tspan class="cls-9"><tspan x="-13.64" y="16.8">Intermediate</tspan></tspan><tspan class="cls-9"><tspan x="-35.38" y="50.4">the pupil stabilizes—</tspan></tspan><tspan class="cls-9"><tspan x="-38.77" y="67.2">reflecting increasing</tspan></tspan><tspan class="cls-9"><tspan x="-61.63" y="84">adaptability and refined skill.</tspan></tspan></text>
    <text class="cls-4" transform="translate(768.74 346.57)"><tspan class="cls-1"><tspan x="0" y="0">Low light </tspan></tspan><tspan class="cls-9"><tspan x="-2.46" y="16.8">Advanced</tspan></tspan><tspan class="cls-9"><tspan x="-31.37" y="50.4">the pupil expands—</tspan></tspan><tspan class="cls-9"><tspan x="-72.95" y="67.2">signifying heightened sensitivity</tspan></tspan><tspan class="cls-9"><tspan x="-48.34" y="84">and advanced capability.</tspan></tspan></text>
    <text class="cls-2" transform="translate(120 51.48)"><tspan x="0" y="0">Logo Variability</tspan></text>
    <text class="cls-3" transform="translate(120 83.48) scale(.98 1)"><tspan x="0" y="0">Kaleido’s symbol is variable. Resembling an eye, it reflects the brand’s focus on visual impairments.</tspan><tspan x="0" y="16.8">Inspired by the pupil’s changing size, it can denote levels—beginner, intermediate, and advanced.</tspan></text>
