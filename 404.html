<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/img/logo.png">
<meta name="theme-color" content="#000000">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter+Tight:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">

<body>

<a class="skip-link" href="#main">본문 바로가기</a>

<header class="site-header" id="site-header">

      <span class="logo-text-group">

        <span class="logo-tagline">스튜디오 벡</span>
      </span>
    </a>
    <a class="btn btn-hero-download" href="/#top">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0l6-6m-6 6l6 6"/></svg>

<main id="main">

      <div class="notfound-art">
        <canvas id="notfound-canvas" class="notfound-canvas" aria-hidden="true"></canvas>

      <p class="notfound-eyebrow">ERROR 404</p>
      <p class="notfound-hint">마우스를 움직이거나 화면을 터치해 보세요</p>

      <h1 class="notfound-title">

        <span class="highlight highlight-dark">사라졌거나 옮겨졌습니다</span>
      </h1>
      <p class="notfound-desc">
        주소를 다시 한번 확인해 주시거나,<br>
        아래 버튼으로 처음 화면부터 다시 둘러봐 주세요.
      </p>

      <div class="button-row notfound-actions">
        <a class="btn notfound-primary-btn" href="/#top">홈으로 돌아가기</a>
        <a class="btn notfound-outline-btn" href="/#works">작업물 보러가기</a>

    </div>

<footer class="site-footer">
  <div class="container">
