# Publishes only the site files to GitHub Pages on every push to master.
# A new top-level site file or folder must be added to the cp list below; new project
# pages named pNN-* are picked up automatically. Everything else stays in the repo but
# is not served. paths-ignore only skips pointless deploys: a working folder missing
# from it just costs an extra run.
name: Deploy site

on:
  push:
    branches: [master]
    # Skip the deploy when a push only touches files that are never served.
    paths-ignore:
      - 'FLANT/**'
      - 'Kalido/**'
      - 'STARRY/**'
      - 'SeolRed/**'
      - 'YomYom/**'
      - '_web/**'
      - 'tools/**'
      - 'partials/**'
      - '.claude/**'
      - 'assets/img/_originals/**'
      - '**/CLAUDE.md'
      - '.gitattributes'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          # -al hardlinks instead of copying ~470MB; the artifact step tars real files.
          cp -al index.html 404.html favicon.ico CNAME robots.txt rss.xml sitemap.xml \
                LICENSE css js covers assets p[0-9][0-9]-*/ _site/
          rm -rf _site/assets/img/_originals

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
